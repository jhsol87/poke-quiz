function panel(h){ui=true;pi.innerHTML=h+'<p><button id="cl">닫기</button></p>';pn.style.display='flex';$('cl').onclick=close}
function close(){pn.style.display='none';pi.className='';ui=false;draw()}
function dex(){const c=Object.values(P.dex).filter(d=>d.c).length,s=Object.keys(P.dex).length;
panel(`<div class="big">📖 ${P.name}의 도감</div><p>만남 ${s} · 잡음 ${c} / ${M.length}</p><div class="g">${M.map(m=>{const d=P.dex[m.id];return `<div class="cell"><div class="sp" style="background:${d&&d.c?TC[m.t[0]]+'66':'rgba(128,128,128,.25)'}"><img src="${IMG(m.num)}" onerror="this.remove()" style="${d&&d.c?'':'filter:brightness(0)'+(d?'':';opacity:.35')}"></div>No.${m.num}<br>${d?m.n:'???'}<br>${d?(d.c?'⭐ 잡았어요':'👀 만났어요'):''}</div>`}).join('')}</div>`)}
function att(){const d=new Date(),y=d.getFullYear(),mo=d.getMonth(),n=new Date(y,mo+1,0).getDate(),f=new Date(y,mo,1).getDay(),t=today();let h=['일','월','화','수','목','금','토'].map(s=>`<div><b>${s}</b></div>`).join('')+'<div></div>'.repeat(f);
for(let i=1;i<=n;i++){const k=y+'-'+String(mo+1).padStart(2,'0')+'-'+String(i).padStart(2,'0');h+=`<div style="${k==t?'outline:3px solid #f90;':''}${P.att.includes(k)?'background:#7ddc7d;color:#222':''}">${i}${P.att.includes(k)?'<br>✅':''}</div>`}
panel(`<div class="big">📅 ${P.name}의 출석</div><p>${y}년 ${mo+1}월</p><div class="cal">${h}</div><p><button id="ck" ${P.att.includes(t)?'disabled':''}>${P.att.includes(t)?'오늘 출석 완료!':'출석하기'}</button></p>`);
$('ck').onclick=()=>{if(!P.att.includes(t)){P.att.push(t);save();snd(880);att()}}}
function buddy(){const cs=M.filter(m=>P.dex[m.id]&&P.dex[m.id].c);
panel(`<div class="big">🐾 동료 고르기</div><p>${P.buddy==null?'아직 동료가 없어요':'지금 동료: '+M[P.buddy].n}</p><div class="g">${cs.map(m=>`<button data-b="${m.id}" style="background:${TC[m.t[0]]}">${m.n}</button>`).join('')}</div><p><button data-b="-1">동료 없음</button></p>`);
pi.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const v=+b.dataset.b;P.buddy=v<0?null:v;save();snd(700);close()})}
// ---- battle ----
function enc(){let m;const n=P.pity+1;
if(n>=20||Math.random()<.015){P.pity=0;const un=LEG.filter(i=>!(P.dex[i]&&P.dex[i].c));m=M[pick(un.length?un:LEG)]}
else{P.pity=n;const af=AFF[P.map],w=M.filter(x=>x.g<2).flatMap(x=>Array((x.g?1:2)*(af.some(c=>x.t.includes(c))?4:1)).fill(x));m=pick(w)}
P.dex[m.id]=Object.assign({},P.dex[m.id],{s:1});save();snd(520,.25);battle(m)}
function sp(c,u,fb){fb();const im=new Image();im.onload=()=>{c.clearRect(0,0,96,96);c.drawImage(im,0,0,96,96)};im.src=u}
function battle(m){ui=true;let got=0,need=NEED[m.g],Q;pn.style.display='flex';pi.className='bt';const bk=P.buddy!=null?M[P.buddy]:null;
pi.innerHTML=`<div id="sc"><div class="pf pe"></div><div class="pf pp"></div><canvas id="ec" width="96" height="96"></canvas><canvas id="pc" width="96" height="96"></canvas><div class="ib"><b>${m.n}</b><span>No.${m.num}</span><div class="hp"><i id="hp"></i></div></div>${bk?`<div class="ib me"><b>${bk.n}</b></div>`:''}</div><div id="tb"><div id="tx"></div><div id="cs" class="ch"></div></div>`;
const B='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/';
sp($('ec').getContext('2d'),IMG(m.num),()=>blob($('ec').getContext('2d'),0,0,96,m));
const pc=$('pc').getContext('2d');
if(bk)sp(pc,B+'back/'+bk.num+'.png',()=>blob(pc,0,0,96,bk));else{pc.fillStyle='#3a5fcd';pc.fillRect(30,50,36,36);pc.fillStyle='#d83a3a';pc.fillRect(28,12,40,36);pc.fillStyle='#ffd7a8';pc.fillRect(36,44,24,8)}
const tx=$('tx'),cs=$('cs');
const hp=()=>{const p=(need-got)/need*100,e=$('hp');e.style.width=p+'%';e.style.background=p<30?'#e44':p<60?'#ec4':'#4c4'};
function ask(){Q=quiz();tx.textContent=Q.q;cs.innerHTML='';Q.ch.forEach((c,i)=>{const b=document.createElement('button');b.textContent=c;b.onclick=()=>{if(i==Q.a){snd(880);got++;hp();cs.innerHTML='';if(got>=need)win();else{tx.textContent='좋아! 한 번 더!';setTimeout(ask,700)}}else{snd(220,.2);b.classList.add('x');b.disabled=true;tx.textContent='다시 해볼까요? 💪'}};cs.appendChild(b)})}
function win(){P.dex[m.id].c=1;save();snd(1040,.3);$('ec').style.cssText+='transition:transform .6s;transform:scale(0)';tx.textContent='몬스터볼 슝~! 🎉 '+m.n+'을(를) 잡았다!';cs.innerHTML='<button id="go" style="grid-column:1/3">계속 탐험하기</button>';$('go').onclick=close}
tx.textContent=(m.g==2?'✨ 전설의 ':'야생의 ')+m.n+'이(가) 나타났다!';setTimeout(ask,1100)}
// ---- start ----
function start(n){P=load(n);prev=null;$('title').hidden=true;$('game').hidden=false;draw()}
document.querySelectorAll('#title [data-p]').forEach(b=>b.onclick=()=>start(b.dataset.p));
$('b1').onclick=()=>!ui&&dex();$('b2').onclick=()=>!ui&&att();$('b3').onclick=()=>!ui&&buddy();
$('b4').onclick=()=>{if(ui)return;save();$('game').hidden=true;$('title').hidden=false};
document.querySelectorAll('#dp [data-d]').forEach(b=>{const d=b.dataset.d.split(',').map(Number);const stop=()=>{clearInterval(tmr);tmr=null};
b.addEventListener('pointerdown',e=>{e.preventDefault();stop();mv(d[0],d[1]);tmr=setInterval(()=>mv(d[0],d[1]),170)});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop))});
addEventListener('keydown',e=>{const k={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(k&&P&&!$('game').hidden){e.preventDefault();mv(k[0],k[1])}});
})();
</script></body></html>
