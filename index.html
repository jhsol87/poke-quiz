<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>포켓몬 탐험 학교</title>
<style>
:root{--ink:#243047;--cream:#fff8e9;--green:#6f9d64;--deep:#345b48;--gold:#e6b84f;--line:#d9d0bb;--panel:#fffdf6}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color:var(--ink);background:#dce8d4}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:#f5d779;color:#3b3424;font-weight:800;box-shadow:0 3px 0 #c59d3e}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #c59d3e}
button.secondary{background:#e8ecdf;box-shadow:0 3px 0 #bdc8b1}button:disabled{opacity:.5}
.app{max-width:1100px;margin:auto;padding:12px}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;background:var(--panel);border:3px solid #8b9e76;border-radius:18px;padding:10px 14px;margin-bottom:10px;box-shadow:0 5px 0 #aab99b}
.brand{font-weight:1000;font-size:20px;color:#355a43}.top small{color:#68765f}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:12px}
.gamecard,.sidecard{background:var(--panel);border:3px solid #8b9e76;border-radius:18px;padding:12px;box-shadow:0 5px 0 #aab99b}
canvas{width:100%;height:auto;display:block;border-radius:12px;border:3px solid #6e8b60;background:#a8cb88;image-rendering:pixelated;touch-action:none}
.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:8px 0;font-weight:800}
.controls{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,46px);gap:5px;justify-content:center;margin:8px auto}
.controls button{padding:0;font-size:22px;background:#e6eddf;box-shadow:0 3px 0 #b6c7a9;touch-action:none;user-select:none}
.controls .empty{visibility:hidden}
.sidecard h3{margin:2px 0 10px}.sidecard p{font-size:13px;line-height:1.55;color:#56634f}
.actionlist{display:grid;gap:7px}.actionlist button{width:100%;text-align:left}
.status{padding:9px 11px;background:#edf3e6;border-radius:12px;font-size:13px;line-height:1.5;margin-top:8px}
.overlay{position:fixed;inset:0;background:#17251dcc;display:none;align-items:center;justify-content:center;padding:12px;z-index:5;overflow:auto}
.modal{width:min(760px,100%);background:#fff9e9;border:4px solid #718d62;border-radius:18px;padding:14px;box-shadow:0 10px 0 #314a38}
.modal h2{margin:4px 0 10px}.battlefield{position:relative;min-height:320px;border:3px solid #718d62;border-radius:14px;overflow:hidden;background:linear-gradient(#cce1d4 0 55%,#a9c78c 55% 70%,#e5e1b6 70%)}
.battlefield:before{content:"";position:absolute;left:-5%;right:-5%;height:90px;bottom:0;background:radial-gradient(ellipse,#87ad68 0 48%,transparent 50%);opacity:.8}
.pokeinfo{position:absolute;top:14px;left:14px;width:210px;background:#fffdf1;border:3px solid #647b59;border-radius:12px;padding:8px;z-index:1}
.hp{height:9px;background:#d7d7c8;border-radius:8px;overflow:hidden;margin-top:5px}.hp span{display:block;height:100%;background:#6dbb63;width:100%;transition:width .35s}
.wild{position:absolute;right:8%;top:10px;width:190px;height:190px;object-fit:contain;image-rendering:pixelated;filter:brightness(0) saturate(100%);z-index:1}
.trainer{position:absolute;left:7%;bottom:0;width:160px;height:180px;object-fit:contain;image-rendering:pixelated;z-index:1}
.battletext{background:#fffdf5;border:3px solid #6e805f;border-radius:12px;padding:12px;margin-top:10px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.answers button{background:#f3edda;box-shadow:0 3px 0 #c7bda2;text-align:left}
.captureImg{width:170px;height:170px;object-fit:contain;image-rendering:pixelated;display:block;margin:4px auto}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;max-height:55vh;overflow:auto}
.dexitem{background:#f1f3e9;border:2px solid #d5ddca;border-radius:12px;padding:8px;text-align:center;font-size:12px}
.dexitem img{width:72px;height:72px;object-fit:contain;image-rendering:pixelated}.dexitem .unknown{filter:brightness(0) saturate(100%)}
.fieldrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{padding:9px;border:2px solid #c8d2bd;border-radius:10px;background:white;font:inherit}
@media(max-width:760px){.layout{grid-template-columns:1fr}.sidecard{order:-1}.sidecard .actionlist{grid-template-columns:repeat(2,1fr)}.sidecard p{display:none}.wild{width:145px;height:145px;right:3%}.trainer{width:125px;height:145px;left:3%}.pokeinfo{width:180px}.battlefield{min-height:280px}.answers{grid-template-columns:1fr 1fr}.app{padding:7px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="brand">✦ 포켓몬 탐험 학교</div><small>탐험하고, 배우고, 포켓몬을 모아보자!</small></div><div class="fieldrow"><select id="profile"><option value="0">모험가 1</option><option value="1">모험가 2</option></select><button class="secondary" id="attendance">오늘 출석</button><button class="secondary" id="openDex">도감</button></div></header>
<div class="layout">
<main class="gamecard">
<div class="hud"><span id="areaName">초록마을</span><span id="caughtCount">도감 0 / 로딩 중</span><span id="coords">이동: 방향키 / WASD</span></div>
<canvas id="field" width="640" height="416" aria-label="탐험 필드"></canvas>
<div class="controls" aria-label="터치 이동 방향키">
<div class="empty"></div><button data-dir="up">▲</button><div class="empty"></div>
<button data-dir="left">◀</button><button class="secondary" id="centerBtn">●</button><button data-dir="right">▶</button>
<div class="empty"></div><button data-dir="down">▼</button><div class="empty"></div>
</div>
<div class="status" id="message">풀숲을 찾아 탐험해 보세요. 초록색 풀숲에서 야생 포켓몬을 만날 수 있어요.</div>
</main>
<aside class="sidecard"><h3>모험 기록</h3><div class="actionlist">
<button id="openDex2">📖 포켓몬 도감</button><button id="openStudy">✏️ 학습 영역</button>
<button id="openMap">🗺️ 지역 안내</button><button id="saveNow" class="secondary">💾 저장하기</button>
</div><div class="status" id="profileStats">포획 0마리 · 발견 0마리</div><p>이동: 키보드 방향키/WASD 또는 화면의 방향 버튼을 누르고 있어 보세요. 풀숲에 들어가면 야생 포켓몬을 만날 수 있습니다.</p><p><b>조우 규칙</b><br>일반 포켓몬은 2문제, 희귀·전설·환상 포켓몬은 4문제를 맞히면 포획합니다.</p></aside>
</div>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id), canvas=$("field"),ctx=canvas.getContext("2d");
const API="https://pokeapi.co/api/v2/";
const STARTERS=[
152,153,154,155,156,157,158,159,160,252,253,254,255,256,257,258,259,260,
387,388,389,390,391,392,393,394,395,495,496,497,498,499,500,501,502,503,
650,651,652,653,654,655,656,657,658,722,723,724,725,726,727,728,729,730,
810,811,812,813,814,815,816,817,818,906,907,908,909,910,911,912,913,914];
const LEGENDARY=[144,145,146,150,243,244,245,249,250,377,378,379,380,381,382,383,384,480,481,482,483,484,486,487,488,638,639,640,641,642,643,644,645,646,647,648,649,716,717,718,772,773,785,786,787,788,789,790,791,792,800,888,889,890,891,892,894,895,896,897,898,905,1001,1002,1003,1004,1007,1008];
const MYTHICAL=[151,251,385,386,489,490,491,492,493,494,647,648,649,719,720,721,801,802,807,808,809,893,1025];
const curated=[...new Set([...Array.from({length:151},(_,i)=>i+1),...STARTERS.filter(Number.isInteger),...LEGENDARY.filter(Number.isInteger),...MYTHICAL.filter(Number.isInteger)])].sort((a,b)=>a-b);
const namesFallback={1:"이상해씨",2:"이상해풀",3:"이상해꽃",4:"파이리",5:"리자드",6:"리자몽",7:"꼬부기",8:"어니부기",9:"거북왕",25:"피카츄",26:"라이츄",150:"뮤츠",151:"뮤"};
const typeKo={normal:"노말",fire:"불꽃",water:"물",electric:"전기",grass:"풀",ice:"얼음",fighting:"격투",poison:"독",ground:"땅",flying:"비행",psychic:"에스퍼",bug:"벌레",rock:"바위",ghost:"고스트",dragon:"드래곤",dark:"악",steel:"강철",fairy:"페어리"};
const state={profile:0,player:{x:2,y:2,area:0,dir:"down"},data:{caught:[],seen:[],attendance:[],encounters:0},dex:[],questions:{},active:null,move:null,stepCooldown:0,apiReady:false};
const areas=[
{name:"초록마을",theme:"#9fca87",rare:[25,37,133]}, {name:"숲길",theme:"#76a96f",rare:[43,46,69]}, {name:"물가",theme:"#83c5d4",rare:[54,60,72]}, 
{name:"바위산",theme:"#b9a88b",rare:[74,95]}, {name:"꽃들판",theme:"#b8ce83",rare:[35,39]}, {name:"어두운 동굴",theme:"#777b86",rare:[41,66,92]},
{name:"바닷가",theme:"#83c5d4",rare:[98,120,129]}, {name:"고대 유적",theme:"#bca77d",rare:[63,100,201]}, {name:"전설의 숲",theme:"#8bb58c",rare:[150,151,249,250,385,386,493]}
];
const tiles=[
["####################","#....g.............#","#..g...........g...#","#......g...........#","#.............g....#","#..g................","#..................#","#.....g............#","#..............g...#","#..................#","####################"],
["####################","#..g.....T.........#","#..g...........g...#","#......g...........#","#.............g....#","#....g.............#","#..................#","#.....g............#","#..............g...#","####################"],
["####################","#....g.............#","#~~~~~.............#","#~~~~~...g.........#","#~~~~~.............#","#....g.............#","#..................#","#..............g...#","####################"]
];
const maps=Array.from({length:9},(_,i)=>tiles[i]||tiles[i%3]);
function storageKey(){return "pokeSchool_v2_profile_"+state.profile}
function loadProfile(){try{const v=JSON.parse(localStorage.getItem(storageKey())||"{}");state.data={caught:v.caught||[],seen:v.seen||[],attendance:v.attendance||[],encounters:v.encounters||0};state.player=v.player||{x:2,y:2,area:0,dir:"down"}}catch(e){}}
function save(){localStorage.setItem(storageKey(),JSON.stringify({...state.data,player:state.player}));$("message").textContent="모험 기록을 저장했어요."}
function img(id,official=true){return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`}
async function getPokemon(id){
 if(state.dex[id])return state.dex[id];
 try{
  const [p,s]=await Promise.all([fetch(API+"pokemon/"+id),fetch(API+"pokemon-species/"+id)]);
  if(!p.ok||!s.ok)throw Error("API");
  const pd=await p.json(),sd=await s.json();
  const ko=sd.names?.find(n=>n.language.name==="ko")?.name||namesFallback[id]||pd.name;
  const entry={id,name:ko,types:pd.types.sort((a,b)=>a.slot-b.slot).map(x=>typeKo[x.type.name]||x.type.name),height:pd.height/10,weight:pd.weight/10,genus:sd.genera?.find(x=>x.language.name==="ko")?.genus||"포켓몬",rarity:MYTHICAL.includes(id)?"환상":LEGENDARY.includes(id)?"전설":STARTERS.includes(id)?"스타팅":"일반",sprite:pd.sprites.front_default||img(id)};
  state.dex[id]=entry;return entry;
 }catch(e){return {id,name:namesFallback[id]||`포켓몬 #${id}`,types:[],height:null,weight:null,genus:"정보 불러오기 필요",rarity:MYTHICAL.includes(id)?"환상":LEGENDARY.includes(id)?"전설":STARTERS.includes(id)?"스타팅":"일반",sprite:img(id),unverified:true}}
}
function rand(arr){return arr[Math.floor(Math.random()*arr.length)]}
function draw(){
 const w=canvas.width,h=canvas.height,t=32;ctx.clearRect(0,0,w,h);
 const area=areas[state.player.area];ctx.fillStyle=area.theme;ctx.fillRect(0,0,w,h);
 const map=maps[state.player.area];
 for(let y=0;y<13;y++)for(let x=0;x<20;x++){
  const c=map[y%map.length][x%map[y%map.length].length]||".",px=x*t,py=y*t;
  if(c==="#"){ctx.fillStyle="#557a50";ctx.fillRect(px,py,t,t);ctx.fillStyle="#73975b";ctx.fillRect(px+3,py+3,t-6,t-6)}
  else if(c==="g"){ctx.fillStyle="#4d944c";ctx.fillRect(px,py,t,t);ctx.strokeStyle="#b2d875";ctx.lineWidth=2;for(let k=0;k<3;k++){ctx.beginPath();ctx.moveTo(px+7+k*8,py+25);ctx.lineTo(px+5+k*8,py+13);ctx.stroke()}}
  else if(c==="~"){ctx.fillStyle="#66b6cf";ctx.fillRect(px,py,t,t);ctx.strokeStyle="#b6e5e8";ctx.beginPath();ctx.moveTo(px+3,py+16);ctx.lineTo(px+27,py+16);ctx.stroke()}
  else {ctx.fillStyle=(x+y)%2?"#a7ce8c":"#a1c782";ctx.fillRect(px,py,t,t)}
 }
 // trainer pixel-art
 const px=state.player.x*t,py=state.player.y*t;
 ctx.fillStyle="#243d52";ctx.fillRect(px+9,py+17,14,13);ctx.fillStyle="#f0bd91";ctx.fillRect(px+10,py+7,12,12);
 ctx.fillStyle="#c74739";ctx.fillRect(px+8,py+4,16,5);ctx.fillRect(px+6,py+8,5,3);
 ctx.fillStyle="#f1e9d2";ctx.fillRect(px+8,py+30,6,4);ctx.fillRect(px+18,py+30,6,4);
 $("areaName").textContent=area.name;$("caughtCount").textContent=`도감 ${state.data.caught.length} / ${curated.length}`;
 $("profileStats").textContent=`포획 ${state.data.caught.length}마리 · 발견 ${state.data.seen.length}마리 · 조우 ${state.data.encounters}회`;
}
function blocked(x,y){const map=maps[state.player.area],row=map[y%map.length];return !row||row[x%row.length]==="#"||row[x%row.length]==="~"}
function move(dir){if(state.active)return;let {x,y}=state.player;const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[dir];if(!d)return;let nx=x+d[0],ny=y+d[1];if(nx<1||nx>18){state.player.area=(state.player.area+(nx>18?1:8))%9;nx=nx<1?18:1}if(ny<1||ny>11)ny=ny<1?11:1;if(!blocked(nx,ny)){state.player.x=nx;state.player.y=ny;state.player.dir=dir;draw();const tile=maps[state.player.area][ny%maps[state.player.area].length]?.[nx%maps[state.player.area][ny%maps[state.player.area].length].length];if(tile==="g"&&Math.random()<.18)encounter()}}
let keys={};window.addEventListener("keydown",e=>{const k=e.key.toLowerCase(),d={arrowup:"up",w:"up",arrowdown:"down",s:"down",arrowleft:"left",a:"left",arrowright:"right",d:"right"}[k];if(d){e.preventDefault();if(!keys[k])move(d);keys[k]=true}});
window.addEventListener("keyup",e=>{delete keys[e.key.toLowerCase()]});
let repeat=null;document.querySelectorAll("[data-dir]").forEach(b=>{const start=e=>{e.preventDefault();const d=b.dataset.dir;move(d);clearInterval(repeat);repeat=setInterval(()=>move(d),175)};const stop=()=>clearInterval(repeat);b.addEventListener("pointerdown",start);["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,stop))});
const english=[["apple","사과"],["book","책"],["cat","고양이"],["dog","개"],["egg","달걀"],["fish","물고기"],["grape","포도"],["house","집"],["ice","얼음"],["juice","주스"],["kite","연"],["lion","사자"],["moon","달"],["nose","코"],["orange","오렌지"],["pen","펜"],["queen","여왕"],["rabbit","토끼"],["sun","태양"],["tree","나무"],["umbrella","우산"],["van","밴"],["water","물"],["yellow","노란색"],["zoo","동물원"]];
const korean=[["‘바다’와 뜻이 반대인 말은?","산","강","하늘","들판",0],["‘크다’의 반대말은?","높다","작다","길다","넓다",1],["‘빠르다’의 반대말은?","느리다","높다","밝다","깊다",0]];
function makeQuestions(type){
 let a=[];
 if(type==="영어"){
  const words=[...english];
  for(let i=0;i<100;i++){
   const [en,ko]=words[i%words.length];
   const wrong=words.filter(x=>x[1]!==ko).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[1]);
   const opts=[ko,...wrong].sort(()=>Math.random()-.5);
   a.push({q:`'${en}'의 뜻은?`,opts,answer:opts.indexOf(ko)});
  }
 }else if(type==="덧셈"||type==="뺄셈"){
  for(let i=0;i<100;i++){
   let x=1+Math.floor(Math.random()*50),y=1+Math.floor(Math.random()*50);
   if(type==="뺄셈"&&y>x)[x,y]=[y,x];
   const ans=type==="덧셈"?x+y:x-y;
   const candidates=[ans,ans+1,Math.max(0,ans-1),ans+2];
   const opts=[...new Set(candidates)];
   while(opts.length<4)opts.push(ans+opts.length+2);
   opts.sort(()=>Math.random()-.5);
   a.push({q:`${x} ${type==="덧셈"?"+":"−"} ${y} = ?`,opts:opts.map(String),answer:opts.indexOf(ans)});
  }
 }else{
  const templates=[
   ["‘바다’와 뜻이 반대인 말은?",["산","강","하늘","들판"],0],
   ["‘크다’의 반대말은?",["높다","작다","길다","넓다"],1],
   ["‘빠르다’의 반대말은?",["느리다","높다","밝다","깊다"],0],
   ["‘기쁘다’와 비슷한 뜻은?",["슬프다","즐겁다","무섭다","피곤하다"],1],
   ["‘아침’의 반대 시간은?",["점심","저녁","낮","오전"],1],
   ["‘뜨겁다’의 반대말은?",["차갑다","따뜻하다","덥다","맵다"],0],
   ["‘무겁다’의 반대말은?",["크다","가볍다","높다","길다"],1],
   ["‘밝다’의 반대말은?",["환하다","어둡다","맑다","깨끗하다"],1]
  ];
  for(let i=0;i<100;i++){const [q,opts,answer]=templates[i%templates.length];a.push({q,opts:[...opts],answer})}
 }
 return a;
}
function showOverlay(content){$("modal").innerHTML=content;$("overlay").style.display="flex"}
function closeOverlay(){$("overlay").style.display="none";state.active=null;draw()}
$("overlay").addEventListener("click",e=>{if(e.target===$("overlay"))closeOverlay()});
async function encounter(){
 if(state.active)return;let pool=curated.filter(id=>id<=151);const area=areas[state.player.area];if(Math.random()<.22)pool=pool.concat(area.rare.filter(Number.isInteger));if(state.player.area===8&&Math.random()<.08)pool=pool.concat(LEGENDARY.filter(Number.isInteger),MYTHICAL.filter(Number.isInteger));
 const id=rand(pool);const p=await getPokemon(id);state.data.encounters++;if(!state.data.seen.includes(id))state.data.seen.push(id);
 const count=["전설","환상"].includes(p.rarity)?4:MYTHICAL.includes(id)||LEGENDARY.includes(id)?4:2;
 state.active={pokemon:p,total:count,index:0,area:state.player.area};const q=makeQuestions(rand(["영어","한글","덧셈","뺄셈"]))[Math.floor(Math.random()*20)];
 state.active.questions=Array.from({length:count},(_,i)=>makeQuestions(i%4===0?"영어":i%4===1?"한글":i%4===2?"덧셈":"뺄셈")[Math.floor(Math.random()*80)]);
 renderBattle();
}
function renderBattle(){
 const a=state.active,p=a.pokemon,q=a.questions[a.index];const pct=(a.index/a.total)*100;
 showOverlay(`<h2>야생 ${p.name}이(가) 나타났다!</h2><div class="battlefield"><div class="pokeinfo"><b>${p.name}</b> <small>Lv. ${Math.max(3,Math.floor(p.id/30)+3)}</small><div class="hp"><span style="width:${100-pct}%"></span></div></div><img class="wild" src="${img(p.id)}" alt="포켓몬 실루엣"><img class="trainer" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/back/25.png" alt="트레이너"></div><div class="battletext"><b>${q.q}</b><div class="answers">${q.opts.map((o,i)=>`<button data-answer="${i}">${["①","②","③","④"][i]} ${o}</button>`).join("")}</div><small>문제 ${a.index+1} / ${a.total} · 정답을 맞히면 공격해요!</small></div>`);
 $("modal").querySelectorAll("[data-answer]").forEach(b=>b.addEventListener("click",()=>answer(Number(b.dataset.answer))));
}
function answer(n){const a=state.active,q=a.questions[a.index];if(n===q.answer){a.index++;if(a.index>=a.total)capture();else renderBattle()}else{$("modal").querySelector(".battletext").insertAdjacentHTML("beforeend",`<div class="status">아쉽지만 다시 도전해 보자! 정답을 다시 골라봐.</div>`)}}
async function capture(){
 const p=state.active.pokemon,first=!state.data.caught.includes(p.id);if(first)state.data.caught.push(p.id);save();
 showOverlay(`<h2>포획 성공!</h2><p style="text-align:center">몬스터볼이 흔들립니다…</p><div style="text-align:center;font-size:54px;animation:shake .55s infinite">⚪</div><img class="captureImg" src="${img(p.id)}" alt="${p.name}"><h2 style="text-align:center">${p.name}</h2><p style="text-align:center">${first?"처음 만난 포켓몬이 도감에 등록되었어!":"이미 도감에 있는 포켓몬을 다시 만났어!"}</p><div class="fieldrow" style="justify-content:center"><button id="seeDex">도감 보기</button><button id="continue">계속 탐험</button></div>`);
 $("seeDex").onclick=()=>{closeOverlay();openDex()};$("continue").onclick=closeOverlay;
}
async function openDex(){const ids=curated;showOverlay(`<h2>포켓몬 도감 <small>${state.data.caught.length} / ${ids.length}</small></h2><div class="dexgrid" id="dexgrid"></div><button id="dexClose">닫기</button>`);const grid=$("dexgrid");for(const id of ids){const caught=state.data.caught.includes(id),seen=state.data.seen.includes(id);const p=await getPokemon(id);const div=document.createElement("div");div.className="dexitem";div.innerHTML=`<img class="${caught?"":"unknown"}" src="${img(id)}"><b>#${String(id).padStart(3,"0")} ${caught||seen?p.name:"???"}</b><div>${caught?p.types.join(" · "):seen?"발견":"미발견"}</div>${caught?`<small>${p.height??"—"}m · ${p.weight??"—"}kg</small>`:""}`;grid.appendChild(div)}$("dexClose").onclick=closeOverlay}
function openStudy(){showOverlay(`<h2>학습 영역</h2><p>문제는 포켓몬 조우 중 무작위로 출제돼요.</p><div class="actionlist">${["영어","한글","덧셈","뺄셈"].map(x=>`<button data-study="${x}">${x} 문제 예시 보기</button>`).join("")}</div><button id="studyClose">닫기</button>`);$("modal").querySelectorAll("[data-study]").forEach(b=>b.onclick=()=>{const q=rand(makeQuestions(b.dataset.study));alert(q.q+"\\n"+q.opts.join(" / "))});$("studyClose").onclick=closeOverlay}
function openMap(){showOverlay(`<h2>지역 안내</h2><div class="actionlist">${areas.map((a,i)=>`<button data-area="${i}">${i+1}. ${a.name}</button>`).join("")}</div><button id="mapClose">닫기</button>`);$("modal").querySelectorAll("[data-area]").forEach(b=>b.onclick=()=>{state.player.area=Number(b.dataset.area);state.player.x=2;state.player.y=2;closeOverlay()});$("mapClose").onclick=closeOverlay}
$("openDex").onclick=$("openDex2").onclick=openDex;$("openStudy").onclick=openStudy;$("openMap").onclick=openMap;$("saveNow").onclick=save;
$("profile").onchange=e=>{save();state.profile=Number(e.target.value);loadProfile();draw()};
$("attendance").onclick=()=>{const d=new Date().toLocaleDateString("sv-SE");if(!state.data.attendance.includes(d)){state.data.attendance.push(d);save();$("message").textContent="오늘 출석 완료!";}else $("message").textContent="오늘은 이미 출석했어요."};
$("centerBtn").onclick=()=>{$("message").textContent="방향 버튼을 길게 누르면 계속 이동해요."};
loadProfile();draw();
// Metadata warm-up for first 151; visible gameplay remains available if the API is offline.
getPokemon(4).then(()=>{state.apiReady=true});
})();
</script>
<style>@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-5px) rotate(-12deg)}75%{transform:translateX(5px) rotate(12deg)}}</style>
</body></html>
