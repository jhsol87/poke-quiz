ght:300px;border:3px solid #758d67;border-radius:14px;background:linear-gradient(#cde4db 0 55%,#9fc78d 55% 100%);overflow:hidden}.wild{position:absolute;right:8%;top:5px;width:190px;height:190px;object-fit:contain;image-rendering:pixelated}.trainer{position:absolute;left:7%;bottom:22px;width:175px;height:190px;object-fit:contain;image-rendering:pixelated}.trainer.front-fallback{transform:scaleX(-1)}.ally-label{position:absolute;left:12px;bottom:7px;z-index:2;background:#fffdf2;border:1px solid #738467;border-radius:8px;padding:4px 8px;font-size:11px;font-weight:800}.ally-empty{position:absolute;left:12px;bottom:12px;background:#fffdf2;border:1px dashed #738467;border-radius:9px;padding:8px;font-size:11px;color:#65715f}.pokeinfo{position:absolute;left:12px;top:12px;background:#fffdf2;border:2px solid #738467;border-radius:10px;padding:9px;min-width:170px}.battletext{background:#fffdf5;border:2px solid #899a7b;border-radius:12px;padding:12px;margin-top:10px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.answers button{text-align:left;background:#edf0e5;box-shadow:0 3px 0 #c6cfba}.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px;max-height:58vh;overflow:auto;margin:12px 0}.dexitem{background:#f0f3e9;border:1px solid #d4ddca;border-radius:12px;padding:8px;text-align:center;font-size:12px;min-height:145px}.dexitem img{width:76px;height:76px;object-fit:contain;display:block;margin:0 auto 6px}.dexmeta{display:block;border-top:1px solid #d4ddca;padding-top:6px;line-height:1.45}.dexname{display:block;min-height:2.7em}.dexitem .hidden{opacity:.18;filter:grayscale(1)}.dexitem .detail{font-size:11px;color:#53634d;margin-top:4px}.field{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.field button{text-align:left}.choice{display:flex;gap:8px;align-items:center;padding:10px;border:1px solid #d4ddca;border-radius:12px;margin:6px 0;background:#f5f6ef}.choice img{width:55px;height:55px;object-fit:contain}.ch <div class="layout"><main class="panel"><div class="hud"><span id="areaName">초록마을</span><span id="caughtCount">도감 0</span><span id="coord">방향키 / WASD</span></div><canvas id="field" width="640" height="416" aria-label="탐험 필드"></canvas><div class="controls"><span class="blank"></span><button data-dir="up">▲</button><span class="blank"></span><button data-dir="left">◀</button><button class="secondary" id="center">●</button><button data-dir="right">▶</button><span class="blank"></span><button data-dir="down">▼</button><span class="blank"></span></div><div class="status" id="message">풀숲을 찾아 탐험해 보세요. 풀숲에서 야생 포켓몬을 만날 수 있어요.</div></main>
<aside class="side"><h3>모험 기록</h3><div class="actions"><button id="dex2">📖 포켓몬 도감</button><button id="study">✏️ 학습 영역</button><button id="attendanceView">🗓️ 출석표</button><button id="map">🗺️ 지역 안내</button><button id="companion">🧢 동행 포켓몬</button><button id="settings">⚙️ 모험 설정</button><button class="secondary" id="save">💾 저장하기</button></div><div class="status" id="stats"></div><p class="muted">풀숲에서 포켓몬을 만나 문제를 풀어 보세요. 일반 포켓몬은 2문제, 진화형은 3문제, 전설·환상 포켓몬은 4문제를 맞히면 포획할 수 있어요. 특별한 포켓몬은 낮은 확률로 등장하며, 야생 포켓몬 20회 조우마다 한 번은 확정으로 만날 수 있어요.</p></aside></div></div>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('field'),ctx=canvas.getContext('2d'),API='https://pokeapi.co/api/v2/';
const STARTERS=[152,153,154,155,156,157,158,159,160,252,253,254,255,256,257,258,259,260,387,388,389,390,391,392,393,394,395,495,496,497,498,499,500,501,502,503,650,651,652,653,654,655,656,657,658,722,723,724,725,726,727,728,729,730,810,811,812,813,814,815,816,817,818,906,907,908,909,910,911,912,913,914];
const LEGENDARY=[144,145,146,150,243,244,245,249,250,377,378,379,380,381,382,383,384,480,481,482,483,484,486,487,488,638,639,640,641,642,643,644,645,646,647,648,649,716,717,718,772,773,785,786,787,788,789,790,791,792,800,888,889,890,891,892,894,895,896,897,898,905,1001,1002,1003,1004,1007,1008];
const MYTHICAL=[151,251,385,386,489,490,491,492,493,494,647,648,649,719,720,721,801,802,807,808,809,893,1025];
const BASE_DEX=[...Array.from({length:151},(_,i)=>i+1),...STARTERS,...LEGENDARY,...MYTHICAL];
const typeKo={normal:'노말',fire:'불꽃',water:'물',electric:'전기',grass:'풀',ice:'얼음',fighting:'격투',poison:'독',ground:'땅',flying:'비행',psychic:'에스퍼',bug:'벌레',rock:'바위',ghost:'고스트',dragon:'드래곤',dark:'악',steel:'강철',fairy:'페어리'};
const areas=[
{name:'초록마을',theme:'town',types:['노말'],rare:[52,133,39],common:[16,19,21,29,32,39,52,83]},
{name:'바람숲',theme:'forest',types:['벌레','풀'],rare:[12,15,123,187],common:[10,11,13,14,43,44,46,47,48,69,70,102,187]},
{name:'푸른 해변',theme:'beach',types:['물'],rare:[72,90,131,134],common:[7,8,54,60,98,118,120,129]},
{name:'모래 사막',theme:'desert',types:['땅','바위'],rare:[28,51,95,111],common:[27,28,50,51,74,75,95,104,111]},
{name:'눈꽃 설원',theme:'snow',types:['얼음'],rare:[87,124,221,225],common:[86,87,90,124,220,221,225,238,361,363]},
{name:'불꽃 화산',theme:'volcano',types:['불꽃'],rare:[59,78,126,136],common:[4,5,6,37,58,77,78,126]},
{name:'꽃의 초원',theme:'flower',types:['페어리','풀'],rare:[35,36,175,183],common:[35,36,39,43,44,69,70,102,114,175,183]},
{name:'신비한 늪지',theme:'swamp',types:['독','물'],rare:[42,89,94,195],common:[23,24,41,42,43,44,72,88,89,92,109,194,195,316,317]},
{name:'수정 동굴',theme:'cave',types:['바위','강철','에스퍼'],rare:[82,95,208,302],common:[63,64,66,67,74,75,76,81,82,95,96,100,101,208,302,343]}
];
// 지역별 출현 목록은 각 지역의 중심 타입에 맞춰 직접 구성합니다.
const ENCOUNTER_IDS=[...new Set(areas.flatMap(a=>[...a.common,...a.rare]))];
const SPECIAL_POOL=[...new Set([...LEGENDARY,...MYTHICAL])];
const DEX=[...new Set([...BASE_DEX,...ENCOUNTER_IDS,...SPECIAL_POOL])].sort((a,b)=>a-b);
function makeMap(i){
 // Each region is a small connected maze with a different route shape.
 // # wall, g grass, o rock, T tree, ~ water, C crystal, ^ cliff, L lava, F flower, R reeds
 const m=Array.from({length:13},()=>Array(20).fill('b'));
 const carve=(x,y)=>{if(x>=0&&x<20&&y>=0&&y<13)m[y][x]='.';};
 const path=(pts)=>{for(let n=1;n<pts.length;n++){let [x1,y1]=pts[n-1],[x2,y2]=pts[n];let x=x1,y=y1;carve(x,y);while(x!==x2||y!==y2){if(x!==x2)x+=Math.sign(x2-x);else y+=Math.sign(y2-y);carve(x,y);}}};
 const routes=[
  [[[0,6],[4,6],[4,3],[9,3],[9,8],[14,8],[14,5],[19,5],[19,6]],[[4,3],[4,1],[7,1]],[[9,8],[9,10],[12,10]]],
  [[[0,6],[3,6],[3,2],[8,2],[8,5],[12,5],[12,9],[16,9],[16,6],[19,6]],[[3,2],[3,1],[6,1]],[[8,5],[6,7],[6,10],[10,10]],[[12,5],[15,3],[18,3]]],
  [[[0,6],[4,6],[4,9],[8,9],[8,4],[13,4],[13,7],[17,7],[17,6],[19,6]],[[4,9],[4,11],[7,11]],[[8,4],[8,2],[12,2]],[[13,7],[13,10],[16,10]]],
  [[[0,6],[3,6],[3,3],[7,3],[7,8],[11,8],[11,4],[16,4],[16,6],[19,6]],[[3,3],[3,1],[6,1]],[[7,8],[7,10],[10,10]],[[11,4],[14,2],[18,2]]],
  [[[0,6],[4,6],[4,2],[9,2],[9,6],[13,6],[13,10],[17,10],[17,6],[19,6]],[[4,2],[4,1],[7,1]],[[9,6],[9,9],[6,9]],[[13,6],[16,3],[18,3]]],
  [[[0,6],[3,6],[3,9],[7,9],[7,4],[11,4],[11,7],[15,7],[15,3],[19,3],[19,6]],[[3,9],[3,11],[6,11]],[[7,4],[7,1],[10,1]],[[11,7],[11,10],[14,10]]],
  [[[0,6],[4,6],[4,3],[8,3],[8,8],[12,8],[12,4],[16,4],[16,6],[19,6]],[[4,3],[4,1],[7,1]],[[8,8],[8,10],[11,10]],[[12,4],[14,2],[18,2]]],
  [[[0,6],[3,6],[3,2],[7,2],[7,6],[11,6],[11,10],[15,10],[15,5],[19,5],[19,6]],[[3,2],[3,1],[5,1]],[[7,6],[7,9],[9,9]],[[11,10],[11,11],[13,11]]],
  [[[0,6],[4,6],[4,2],[8,2],[8,6],[12,6],[12,3],[16,3],[16,6],[19,6]],[[4,2],[4,1],[6,1]],[[8,6],[8,10],[11,10]],[[12,3],[12,1],[15,1]],[[16,6],[16,9],[18,9]]]
 ];
 routes[i].forEach(path);
 // Connect the east-side arrival gate to the maze even when its final bend is above/below the gate.
 let target=null,best=1e9;for(let yy=1;yy<12;yy++)for(let xx=1;xx<20;xx++){if(m[yy][xx]!=='.'||(xx===18&&yy===6)||(xx===19&&yy===6))continue;let d=Math.abs(18-xx)+Math.abs(6-yy);if(d<best){best=d;target=[xx,yy];}}if(target)path([[18,6],target]);
 // Widen selected parts of the main route and branch corridors for child-friendly navigation.
 for(let y=1;y<12;y++)for(let x=1;x<19;x++)if(m[y][x]==='.'&&((x+y+i)%4===0)){if(y+1<12&&m[y+1][x]==='b')m[y+1][x]='.';}
 // Encounter cover is placed as irregular natural clusters rather than rectangular farm-like plots.
 const encounterAnchors=[
  [[14,9]],[[6,2],[10,7],[15,9]],[[5,8],[10,3],[15,7]],[[5,3],[9,9],[15,3]],
  [[6,2],[11,8],[15,3]],[[5,9],[9,3],[14,8]],[[6,3],[10,9],[15,3]],[[5,2],[9,8],[15,4]],[[6,2],[10,9],[15,2]]
 ][i];
 const shapes=[
  [[0,0],[1,0],[2,0],[0,1],[1,1],[2,1],[1,2]], // rounded garden
  [[0,0],[1,0],[2,0],[0,1],[1,1],[2,1],[1,2],[2,2]], // forest undergrowth
  [[0,0],[1,0],[0,1],[1,1],[2,1],[1,2]], // seaweed / tidal pools
  [[0,0],[1,0],[0,1],[1,1],[2,1],[1,2]], // scrub
  [[0,0],[1,0],[0,1],[1,1],[2,1]], // snowdrift
  [[0,0],[1,0],[0,1],[1,1],[1,2]], // hot rock
  [[0,0],[1,0],[2,0],[0,1],[1,1],[2,1],[1,2]], // flower patches
  [[0,0],[1,0],[0,1],[1,1],[2,1],[1,2]], // reeds
  [[0,0],[1,0],[0,1],[1,1],[2,1]] // crystal beds
 ];
 for(const [tx,ty] of encounterAnchors){
  let anchor=null,best=1e9;
  for(let yy=1;yy<12;yy++)for(let xx=2;xx<18;xx++)if(m[yy][xx]==='.' ){const d=Math.abs(xx-tx)+Math.abs(yy-ty);if(d<best){best=d;anchor=[xx,yy];}}
  if(!anchor)continue;
  const [ax,ay]=anchor;
  for(const [dx,dy] of shapes[i])for(const [sx,sy] of [[0,0],[-1,0],[0,-1]]){
   const xx=ax+dx+sx,yy=ay+dy+sy;
   if(xx>=2&&xx<=17&&yy>=1&&yy<=11&&(m[yy][xx]==='.'||m[yy][xx]==='b'))m[yy][xx]='g';
  }
 }
 // Characteristic scenery clusters; all decorative objects are solid obstacles.
 const clusters=[
  // 초록마을: 주택과 광장, 작은 정원. 나무 숲이 아닌 생활 공간.
  [['H',[[1,1],[16,1],[9,9]]],['I',[[2,1],[17,1],[10,9]]],['h',[[1,2],[16,2],[9,10]]],['i',[[2,2],[17,2],[10,10]]],['P',[[8,6],[9,6],[10,6],[11,6]]],['f',[[4,1],[5,1],[14,10],[15,10]]],['o',[[6,5],[14,3]]]],
  // 바람숲: 빽빽한 나무 덩어리와 바위.
  [['T',[[1,1],[2,1],[1,2],[17,1],[18,1],[17,2],[1,10],[2,10],[1,11],[17,10],[18,10],[17,11],[6,1],[7,1],[13,10],[14,10]]],['o',[[10,2],[11,2],[15,8]]]],
  [['~',[[1,2],[2,2],[1,3],[2,3],[16,9],[17,9],[18,9]]],['o',[[6,10],[7,10],[15,2]]]],
  [['o',[[1,2],[2,2],[1,3],[17,9],[18,9],[17,10],[8,1],[9,1]]],['^',[[14,1],[15,1],[14,2]]]],
  [['^',[[1,1],[2,1],[1,2],[17,1],[18,1],[17,2]]],['o',[[1,10],[2,10],[14,9]]],['~',[[15,10],[16,10]]]],
  [['L',[[1,2],[2,2],[1,3],[17,9],[18,9],[17,10]]],['o',[[6,1],[7,1],[14,2]]]],
  // 꽃의 초원: 넓고 열린 평원, 나무는 거의 없고 꽃 타일이 중심.
  [['F',[[1,1],[2,1],[1,2],[17,1],[18,1],[17,2],[1,10],[2,10],[17,10],[5,4],[6,4],[14,8],[15,8],[16,8],[8,10],[9,10]]],['o',[[15,2]]]],
  [['~',[[1,1],[2,1],[1,2],[2,2],[17,9],[18,9],[17,10],[18,10]]],['R',[[5,1],[6,1],[14,1],[15,1],[10,10],[11,10]]],['o',[[1,10],[2,10]]]],
  [['C',[[1,1],[2,1],[1,2],[17,1],[18,1],[17,2],[1,10],[2,10]]],['o',[[6,10],[7,10],[14,9]]],['^',[[14,1],[15,1],[14,2]]]]
 ];
 for(const [tile,coords] of clusters[i])for(const [x,y] of coords)if(m[y][x]==='b')m[y][x]=tile;
 // Distinct landforms: preserve the connected paths while shaping each biome around them.
 const paintBg=(x,y,tile)=>{if(x>=0&&x<20&&y>=1&&y<=11&&m[y][x]==='b')m[y][x]=tile;};
 if(i===2){ // Beach: ocean borders frame a sandy coastal route.
  for(let x=0;x<20;x++){if(m[0][x]==='b')m[0][x]='~';if(m[12][x]==='b')m[12][x]='~';}
  for(let y=1;y<12;y++)if(y!==6){paintBg(0,y,'~');paintBg(19,y,'~');}
  for(let x=1;x<19;x++){paintBg(x,1,'~');paintBg(x,11,'~');}
  [[2,2],[3,2],[2,9],[15,2],[16,9],[17,9]].forEach(([x,y])=>paintBg(x,y,'o'));
 }
 if(i===3){ // Desert: broken dune ridges and rocky outcrops.
  for(let y=1;y<12;y++)for(let x=1;x<19;x++)if(m[y][x]==='b'&&(x*3+y*5)%19===0)m[y][x]='^';
 }
 if(i===4){ // Snow: banks and frozen pools.
  for(let x=1;x<19;x++){if(m[1][x]==='b'&&x%3!==0)m[1][x]='^';if(m[11][x]==='b'&&x%4!==0)m[11][x]='^';}
  [[2,8],[3,8],[16,2],[17,2]].forEach(([x,y])=>paintBg(x,y,'~'));
 }
 if(i===5){ // Volcano: lava pockets among basalt shelves.
  [[2,1],[3,1],[2,2],[16,9],[17,9],[17,10],[8,10],[9,10]].forEach(([x,y])=>paintBg(x,y,'L'));
  for(let y=1;y<12;y++)for(let x=1;x<19;x++)if(m[y][x]==='b'&&(x+y*2)%23===0)m[y][x]='^';

  ${companionId?`<img id="allySprite" class="trainer" alt="${companionName}의 뒷모습"><div class="ally-label">우리 편 · ${companionName}</div>`:`<div class="ally-empty">동행 포켓몬을 설정하면 여기에 등장해요.</div>`}
  </div><div class="battletext"><b>${q.q}</b><div class="answers">${q.opts.map((o,i)=>`<button data-answer="${i}">${['①','②','③','④'][i]} ${o}</button>`).join('')}</div><div class="small">문제 ${a.index+1} / ${a.total} · 정답을 맞히면 다음 문제로!</div></div><p class="small muted">틀려도 괜찮아요. 다시 생각해서 골라 보세요.</p>`);
 const ally=$('allySprite');if(ally)attachBattleBackSprite(ally,companionId);
 $('modal').querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)));
}
function answer(n){const a=state.active,q=a.questions[a.index];if(n===q.answer){a.index++;if(a.index>=a.total)capture();else renderBattle();}else{const old=$('modal').querySelector('.battletext .feedback');if(old)old.remove();$('modal').querySelector('.battletext').insertAdjacentHTML('beforeend','<div class="feedback status">아쉽지만 괜찮아! 다시 생각해 보자.</div>');}}
function capture(){const p=state.active.pokemon,first=!state.data.caught.includes(p.id);if(first)state.data.caught.push(p.id);save(true);show(`<h2>포획 성공!</h2><img class="captureImg" style="display:block;width:170px;height:170px;object-fit:contain;margin:auto" src="${sprite(p.id)}" alt="${p.name}"><h2 style="text-align:center">${p.name}</h2><p style="text-align:center">${first?'처음 만난 포켓몬이 도감에 등록되었어!':'이미 도감에 등록된 포켓몬이야. 다시 만나서 반가워!'}</p><div class="row" style="justify-content:center"><button id="captureDex">도감 보기</button><button id="captureContinue">계속 탐험</button></div>`);$('captureDex').onclick=()=>{state.active=null;openDex();};$('captureContinue').onclick=close;}
let dexPage=0;async function openDex(){state.active=null;const pageSize=30;show(`<h2>포켓몬 도감 <span class="small">${state.data.caught.length} / ${DEX.length} 포획</span></h2><div class="row"><span class="small">포획한 포켓몬은 컬러 이미지로 표시돼요.</span><button class="secondary" id="dexPrev">이전</button><button class="secondary" id="dexNext">다음</button></div><div class="dexgrid" id="dexgrid"></div><button id="dexClose">닫기</button>`);const grid=$('dexgrid');const start=dexPage*pageSize,ids=DEX.slice(start,start+pageSize);ids.forEach(id=>{let caught=state.data.caught.includes(id),seen=state.data.seen.includes(id),div=document.createElement('div');div.className='dexitem';div.innerHTML=`<img class="${caught?'':'hidden'}" loading="lazy" src="${sprite(id)}" alt="포켓몬"><div class="dexmeta"><b class="dexname">#${String(id).padStart(4,'0')} ${caught||seen?(fallback[id]||'정보 불러오는 중'):'???'}</b><div>${caught?'포획 완료':seen?'발견':'미발견'}</div><div class="detail">${caught?'상세 정보 불러오는 중':''}</div></div>`;grid.appendChild(div);if(caught||seen)pokemon(id).then(p=>{const name=div.querySelector('.dexname'),detail=div.querySelector('.detail');if(name)name.textContent=`#${String(id).padStart(4,'0')} ${p.name}`;if(detail)detail.textContent=caught?`${p.types.join(' · ')} · ${p.height??'—'}m · ${p.weight??'—'}kg`:p.types.join(' · ');}).catch(()=>{});});$('dexPrev').disabled=dexPage===0;$('dexNext').disabled=start+pageSize>=DEX.length;$('dexPrev').onclick=()=>{dexPage=Math.max(0,dexPage-1);openDex();};$('dexNext').onclick=()=>{dexPage++;openDex();};$('dexClose').onclick=close;}
function openStudy(){show(`<h2>학습 영역</h2><p>영어·한글·수학·창의력 문제를 풀 수 있어요. 실제 조우에서는 최근 문제와 출제 빈도를 고려해 출제합니다.</p><div class="field">${Object.entries(questionBanks).map(([t,a])=>`<button data-qtype="${t}">${t}<br><span class="small">${a.length}개 문제</span></button>`).join('')}</div><div id="sample" class="status">영역을 선택하면 문제 예시를 볼 수 있어요.</div><button id="studyClose">닫기</button>`);$('modal').querySelectorAll('[data-qtype]').forEach(b=>b.onclick=()=>{let q=rand(questionBanks[b.dataset.qtype]);$('sample').innerHTML=`<b>${b.dataset.qtype} · ${q.q}</b><div class="small">${q.opts.join(' / ')}</div>`;});$('studyClose').onclick=close;}
function openMap(){show(`<h2>지역 안내</h2><div class="field">${areas.map((a,i)=>`<button data-area="${i}">${i+1}. ${a.name}<br><span class="small">${a.types.join(' · ')} 타입 중심 · ${state.data.visited.includes(i)?'탐험한 지역':'아직 방문하지 않음'}</span></button>`).join('')}</div><p class="small muted">지역은 동쪽·서쪽 출입구를 통해 연결됩니다. 가운데 길을 따라 이동해 보세요.</p><button id="mapClose">닫기</button>`);$('modal').querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{let target=Number(b.dataset.area);if(!state.data.visited.includes(target)){$('message').textContent='아직 발견하지 않은 지역이에요. 길을 따라 탐험해 보세요.';return;}state.player.area=target;state.player.x=2;state.player.y=6;if(state.data.companion)follower={x:1,y:6,tx:1,ty:6,dir:'left',phase:0,last:0};close();});$('mapClose').onclick=close;}
let companionPage=0,companionDraft=null,characterDraft='red';
function openCompanionPicker(page=0,preserveDraft=false){
 const caught=[...new Set((Array.isArray(state.data.caught)?state.data.caught:[]).filter(id=>Number.isInteger(id)&&id>0))].sort((a,b)=>a-b);
 if(!preserveDraft)companionDraft=caught.includes(Number(state.data.companion))?Number(state.data.companion):null;
 const pageSize=24,totalPages=Math.max(1,Math.ceil(caught.length/pageSize));
 page=Math.max(0,Math.min(Number.isFinite(page)?page:0,totalPages-1));companionPage=page;
 if(caught.length===0){show(`<h2>동행 포켓몬 설정</h2><p>아직 포획한 포켓몬이 없어요.</p><p class="small">야생 포켓몬과 만나 학습 문제를 풀고 포획하면, 이곳에서 동행 포켓몬으로 선택할 수 있어요.</p><button id="companionEmptyClose">닫기</button>`);$('companionEmptyClose').onclick=close;return;}
 const slice=caught.slice(page*pageSize,(page+1)*pageSize);
 show(`<h2>동행 포켓몬 선택 · ${state.profile===0?'하준이':'하늘이'}</h2><p class="small">포획한 포켓몬만 선택할 수 있어요. 선택한 포켓몬은 필드에서 따라오고 배틀에서는 뒷모습으로 등장해요.</p><div class="companion-grid" id="companions"></div><div class="status" id="companionSelectedName"></div><div class="row" style="justify-content:space-between"><button class="secondary" id="compPrev" ${page===0?'disabled':''}>이전</button><span class="small">${page+1} / ${totalPages}</span><button class="secondary" id="compNext" ${page+1>=totalPages?'disabled':''}>다음</button></div><div class="row" style="margin-top:10px"><button id="companionSave">동행 포켓몬 저장</button><button id="noCompanion" class="secondary">동행 없음</button><button id="companionClose" class="secondary">닫기</button></div>`);
 const holder=$('companions');
 const refresh=()=>{holder.querySelectorAll('[data-companion]').forEach(card=>card.classList.toggle('selected',Number(card.dataset.companion)===companionDraft));$('companionSelectedName').textContent=companionDraft?`선택 중: ${localPokemonName(companionDraft)}`:'선택 중: 동행 포켓몬 없음';};
 slice.forEach(id=>{const card=document.createElement('button');card.type='button';card.className='companion-card';card.dataset.companion=String(id);const image=document.createElement('img');image.loading='lazy';image.alt='';image.src=sprite(id);image.onerror=()=>{image.onerror=null;image.src=`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/${id}.png`;image.onerror=()=>{image.style.visibility='hidden';};};const label=document.createElement('span');label.textContent=localPokemonName(id);card.append(image,label);card.onclick=()=>{companionDraft=id;refresh();};holder.appendChild(card);});
 refresh();
 $('compPrev').onclick=()=>openCompanionPicker(Math.max(0,page-1),true);
 $('compNext').onclick=()=>openCompanionPicker(Math.min(totalPages-1,page+1),true);
 $('noCompanion').onclick=()=>{companionDraft=null;refresh();};
 $('companionSave').onclick=()=>{if(companionDraft!==null&&!state.data.caught.includes(companionDraft)){companionDraft=null;}state.data.companion=companionDraft;loadCompanion(companionDraft);save(true);close();$('message').textContent=companionDraft?`${localPokemonName(companionDraft)}와 함께 모험을 떠나요!`:'동행 포켓몬 없이 모험을 시작해요.';};
 $('companionClose').onclick=close;
}
function openSettings(){
 const chars=[['red','빨간 모험가'],['blue','파란 모험가'],['green','초록 모험가'],['yellow','노란 모험가']];characterDraft=state.data.character||'red';
 show(`<h2>모험 설정 · ${state.profile===0?'하준이':'하늘이'}</h2><h3>주인공 선택</h3><div class="field" id="characterChoices">${chars.map(([id,n])=>`<button type="button" data-char="${id}" class="${characterDraft===id?'':'secondary'}">${n}</button>`).join('')}</div><h3>풀숲 조우 빈도</h3><select id="rate"><option value="0.10">느긋하게 (낮음)</option><option value="0.16">보통</option><option value="0.23">자주 만나기 (높음)</option></select><div class="row" style="margin-top:12px"><button id="settingsSave">설정 저장</button><button id="settingsClose" class="secondary">닫기</button></div>`);
 $('rate').value=String(state.data.settings?.encounterRate||.16);
 $('characterChoices').querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>{characterDraft=b.dataset.char;$('characterChoices').querySelectorAll('[data-char]').forEach(x=>x.classList.toggle('secondary',x.dataset.char!==characterDraft));});
 $('settingsSave').onclick=()=>{state.data.character=characterDraft;state.data.settings.encounterRate=Number($('rate').value)||.16;save(true);close();$('message').textContent='모험 설정을 저장했어요.';};$('settingsClose').onclick=close;
}
function openAttendance(){const now=new Date();let month=new Date(now.getFullYear(),now.getMonth(),1);function render(){const y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),today=now.toLocaleDateString('sv-SE');let cells='';for(const d of ['일','월','화','수','목','금','토'])cells+=`<div class="weekday">${d}</div>`;for(let i=0;i<first;i++)cells+='<div></div>';for(let d=1;d<=days;d++){const keyDate=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,marked=state.data.attendance.includes(keyDate);cells+=`<div class="${marked?'marked ':''}${keyDate===today?'today':''}">${d}${marked?'<small>출석</small>':''}</div>`;}show(`<h2>출석 달력 · ${state.profile===0?'하준이':'하늘이'}</h2><div class="row" style="justify-content:space-between"><button class="secondary" id="attPrev">이전 달</button><b>${y}년 ${m+1}월</b><button class="secondary" id="attNext">다음 달</button></div><div class="calendar">${cells}</div><p class="status">누적 출석 <b>${state.data.attendance.length}일</b> · 초록색으로 표시된 날짜가 출석한 날이에요.</p><button id="attClose">닫기</button>`);$('attPrev').onclick=()=>{month=new Date(y,m-1,1);render();};$('attNext').onclick=()=>{month=new Date(y,m+1,1);render();};$('attClose').onclick=close;}render();}
$('openDex').onclick=$('dex2').onclick=openDex;$('study').onclick=openStudy;$('attendanceView').onclick=openAttendance;$('map').onclick=openMap;$('companion').onclick=()=>openCompanionPicker();$('settings').onclick=openSettings;$('save').onclick=()=>save();$('profile').onchange=()=>{save(true);state.profile=Number($('profile').value);load();dexPage=0;loadCompanion(state.data.companion);draw();$('message').textContent=`${state.profile===0?'하준이':'하늘이'} 모험 기록을 불러왔어요.`;};$('attendance').onclick=()=>{let d=new Date().toLocaleDateString('sv-SE');if(!state.data.attendance.includes(d)){state.data.attendance.push(d);save(true);$('message').textContent='오늘 출석 완료!';}openAttendance();};$('center').onclick=()=>$('message').textContent='방향 버튼을 길게 누르면 계속 이동해요.';
load();loadCompanion(state.data.companion);draw();
function animateFollower(ts){if(state.data?.companion&&follower){const dx=follower.tx-follower.x,dy=follower.ty-follower.y;follower.x+=dx*.18;follower.y+=dy*.18;follower.phase=ts/180;draw();}requestAnimationFrame(animateFollower);}requestAnimationFrame(animateFollower);
})();
</script></body></html>
