function makeMap(i){
 // Each region is a small connected maze with a different route shape.

 const path=(pts)=>{for(let n=1;n<pts.length;n++){let [x1,y1]=pts[n-1],[x2,y2]=pts[n];let x=x1,y=y1;carve(x,y);while(x!==x2||y!==y2){if(x!==x2)x+=Math.sign(x2-x);else y+=Math.sign(y2-y);carve(x,y);}}};

 ];
 routes[i].forEach(path);
 // Connect the east-side arrival gate to the maze even when its final bend is above/below the gate.
 let target=null,best=1e9;for(let yy=1;yy<12;yy++)for(let xx=1;xx<20;xx++){if(m[yy][xx]!=='.'||(xx===18&&yy===6)||(xx===19&&yy===6))continue;let d=Math.abs(18-xx)+Math.abs(6-yy);if(d<best){best=d;target=[xx,yy];}}if(target)path([[18,6],target]);

 // Broad, contiguous grass patches sit beside paths rather than peppering every path tile.
 const grassPatches=[[[6,2],[11,7],[5,9]],[[6,1],[10,7],[15,9]],[[5,8],[10,2],[15,7]],[[5,2],[9,9],[15,3]],[[6,1],[11,8],[15,3]],[[5,9],[9,2],[14,8]],[[6,2],[10,9],[15,3]],[[5,1],[9,8],[15,4]],[[6,1],[10,9],[15,2]]][i];
 for(const [ax,ay] of grassPatches)for(let yy=ay-1;yy<=ay+1;yy++)for(let xx=ax-1;xx<=ax+1;xx++)if(xx>1&&xx<18&&yy>1&&yy<11&&(m[yy][xx]==='.'||m[yy][xx]==='#'))m[yy][xx]='g';
 // Characteristic scenery clusters; all decorative objects are solid obstacles.

  [['T',[[1,2],[2,2],[1,3],[17,10],[18,10],[17,11]]],['o',[[6,5],[7,5],[15,2]]]],

  [['o',[[1,2],[2,2],[1,3],[17,9],[18,9],[17,10],[8,1],[9,1]]],['^',[[14,1],[15,1],[14,2]]]],

function drawTile(c,x,y,t,theme){const px=x*t,py=y*t;const ground=theme==='beach'?'#e8c978':theme==='desert'?'#c9a267':theme==='snow'?'#eaf3f4':theme==='volcano'?'#76605a':theme==='cave'?'#626b79':theme==='swamp'?'#8ca783':theme==='forest'?'#648d5e':'#9fc783';ctx.fillStyle=ground;ctx.fillRect(px,py,t,t);

function renderBattle(){const a=state.active,p=a.pokemon,q=a.questions[a.index];show(`<h2>야생 ${p.name}이(가) 나타났다!</h2><div class="battle"><div class="pokeinfo"><b>${p.name}</b><div class="small">${p.types.join(' · ')||'포켓몬'} · ${p.rarity}</div><div class="progress"><span style="width:${a.index/a.total*100}%"></span></div></div><img class="wild" src="${sprite(p.id)}" alt="${p.name}" onerror="this.style.display='none'"><img class="trainer" src="${sprite(25)}" alt="트레이너"></div><div class="battletext"><b>${q.q}</b><div class="answers">${q.opts.map((o,i)=>`<button data-answer="${i}">${['①','②','③','④'][i]} ${o}</button>`).join('')}</div><div class="small">문제 ${a.index+1} / ${a.total} · 정답을 맞히면 다음 문제로!</div></div><p class="small muted">틀려도 괜찮아요. 다시 생각해서 골라 보세요.</p>`);$('modal').querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)));}
function answer(n){const a=state.active,q=a.questions[a.index];if(n===q.answer){a.index++;if(a.index>=a.total)capture();else renderBattle();}else{const old=$('modal').querySelector('.battletext .feedback');if(old)old.remove();$('modal').querySelector('.battletext').insertAdjacentHTML('beforeend','<div class="feedback status">아쉽지만 괜찮아! 다시 생각해 보자.</div>');}}
function capture(){const p=state.active.pokemon,first=!state.data.caught.includes(p.id);if(first)state.data.caught.push(p.id);save(true);show(`<h2>포획 성공!</h2><img class="captureImg" style="display:block;width:170px;height:170px;object-fit:contain;margin:auto" src="${sprite(p.id)}" alt="${p.name}"><h2 style="text-align:center">${p.name}</h2><p style="text-align:center">${first?'처음 만난 포켓몬이 도감에 등록되었어!':'이미 도감에 등록된 포켓몬이야. 다시 만나서 반가워!'}</p><div class="row" style="justify-content:center"><button id="captureDex">도감 보기</button><button id="captureContinue">계속 탐험</button></div>`);$('captureDex').onclick=()=>{state.active=null;openDex();};$('captureContinue').onclick=close;}
let dexPage=0;async function openDex(){state.active=null;const pageSize=30;show(`<h2>포켓몬 도감 <span class="small">${state.data.caught.length} / ${DEX.length} 포획</span></h2><div class="row"><span class="small">포획한 포켓몬은 컬러 이미지로 표시돼요.</span><button class="secondary" id="dexPrev">이전</button><button class="secondary" id="dexNext">다음</button></div><div class="dexgrid" id="dexgrid"></div><button id="dexClose">닫기</button>`);const grid=$('dexgrid');const start=dexPage*pageSize,ids=DEX.slice(start,start+pageSize);ids.forEach(id=>{let caught=state.data.caught.includes(id),seen=state.data.seen.includes(id),div=document.createElement('div');div.className='dexitem';div.innerHTML=`<img class="${caught?'':'hidden'}" loading="lazy" src="${sprite(id)}" alt="포켓몬"><b>#${String(id).padStart(4,'0')} ${caught||seen?(fallback[id]||'정보 불러오는 중'):'???'}</b><div>${caught?'포획 완료':seen?'발견':'미발견'}</div><div class="detail">${caught?'상세 정보 불러오는 중':''}</div>`;grid.appendChild(div);if(caught||seen)pokemon(id).then(p=>{div.querySelector('b').textContent=`#${String(id).padStart(4,'0')} ${p.name}`;div.querySelector('.detail').textContent=caught?`${p.types.join(' · ')} · ${p.height??'—'}m · ${p.weight??'—'}kg`:p.types.join(' · ');});});$('dexPrev').disabled=dexPage===0;$('dexNext').disabled=start+pageSize>=DEX.length;$('dexPrev').onclick=()=>{dexPage=Math.max(0,dexPage-1);openDex();};$('dexNext').onclick=()=>{dexPage++;openDex();};$('dexClose').onclick=close;}
function openStudy(){show(`<h2>학습 영역</h2><p>각 영역에는 80개 이상의 문제가 준비되어 있어요. 실제 조우에서는 최근 문제와 출제 빈도를 고려해 출제합니다.</p><div class="field">${Object.entries(questionBanks).map(([t,a])=>`<button data-qtype="${t}">${t}<br><span class="small">${a.length}개 문제</span></button>`).join('')}</div><div id="sample" class="status">영역을 선택하면 문제 예시를 볼 수 있어요.</div><button id="studyClose">닫기</button>`);$('modal').querySelectorAll('[data-qtype]').forEach(b=>b.onclick=()=>{let q=rand(questionBanks[b.dataset.qtype]);$('sample').innerHTML=`<b>${b.dataset.qtype} · ${q.q}</b><div class="small">${q.opts.join(' / ')}</div>`;});$('studyClose').onclick=close;}
function openMap(){show(`<h2>지역 안내</h2><div class="field">${areas.map((a,i)=>`<button data-area="${i}">${i+1}. ${a.name}<br><span class="small">${state.data.visited.includes(i)?'탐험한 지역':'아직 방문하지 않음'}</span></button>`).join('')}</div><p class="small muted">지역은 동쪽·서쪽 출입구를 통해 연결됩니다. 가운데 길을 따라 이동해 보세요.</p><button id="mapClose">닫기</button>`);$('modal').querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{let target=Number(b.dataset.area);if(!state.data.visited.includes(target)){$('message').textContent='아직 발견하지 않은 지역이에요. 길을 따라 탐험해 보세요.';return;}state.player.area=target;state.player.x=2;state.player.y=6;if(state.data.companion)follower={x:1,y:6,tx:1,ty:6,dir:'left',phase:0,last:0};close();});$('mapClose').onclick=close;}
let companionPage=0;
function openSettings(page=companionPage){companionPage=page;const chars=[['red','빨간 모험가'],['blue','파란 모험가'],['green','초록 모험가'],['yellow','노란 모험가']];const ids=[25,...state.data.caught.filter(id=>id!==25)];const pageSize=24,totalPages=Math.max(1,Math.ceil(ids.length/pageSize)),slice=ids.slice(page*pageSize,(page+1)*pageSize);show(`<h2>모험 설정 · ${state.profile===0?'하준이':'하늘이'}</h2><h3>주인공 선택</h3><div class="field">${chars.map(([id,n])=>`<button data-char="${id}" class="${state.data.character===id?'':'secondary'}">${n}</button>`).join('')}</div><h3>동행 포켓몬</h3><p class="small">도감처럼 골라 보세요. ${ids.length}마리 보유</p><div class="companion-grid" id="companions"></div><div class="row" style="justify-content:space-between"><button class="secondary" id="compPrev" ${page===0?'disabled':''}>이전</button><span class="small">${page+1} / ${totalPages}</span><button class="secondary" id="compNext" ${page+1>=totalPages?'disabled':''}>다음</button></div><button id="noCompanion" class="secondary">동행 포켓몬 없음</button><h3>풀숲 조우 빈도</h3><select id="rate"><option value="0.10">느긋하게 (낮음)</option><option value="0.16">보통</option><option value="0.23">자주 만나기 (높음)</option></select><div class="row" style="margin-top:12px"><button id="settingsSave">저장</button><button id="settingsClose" class="secondary">닫기</button></div>`);$('rate').value=String(state.data.settings.encounterRate||.16);$('modal').querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>{state.data.character=b.dataset.char;openSettings(page);});let holder=$('companions');slice.forEach(id=>{let div=document.createElement('button');div.className='companion-card '+(state.data.companion===id?'selected':'');div.innerHTML=`<img src="${sprite(id)}" alt=""><span>${fallback[id]||'포켓몬 #'+id}</span>`;div.onclick=()=>{state.data.companion=id;loadCompanion(id);openSettings(page);};holder.appendChild(div);if(id!==25)pokemon(id).then(p=>{if(div.isConnected)div.querySelector('span').textContent=p.name;});});$('compPrev').onclick=()=>openSettings(Math.max(0,page-1));$('compNext').onclick=()=>openSettings(Math.min(totalPages-1,page+1));$('noCompanion').onclick=()=>{state.data.companion=null;loadCompanion(null);openSettings(page);};$('settingsSave').onclick=()=>{state.data.settings.encounterRate=Number($('rate').value);loadCompanion(state.data.companion);save(true);close();$('message').textContent='설정을 저장했어요.';};$('settingsClose').onclick=close;}
function openAttendance(){const now=new Date();let month=new Date(now.getFullYear(),now.getMonth(),1);function render(){const y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),today=now.toLocaleDateString('sv-SE');let cells='';for(const d of ['일','월','화','수','목','금','토'])cells+=`<div class="weekday">${d}</div>`;for(let i=0;i<first;i++)cells+='<div></div>';for(let d=1;d<=days;d++){const keyDate=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,marked=state.data.attendance.includes(keyDate);cells+=`<div class="${marked?'marked ':''}${keyDate===today?'today':''}">${d}${marked?'<small>출석</small>':''}</div>`;}show(`<h2>출석 달력 · ${state.profile===0?'하준이':'하늘이'}</h2><div class="row" style="justify-content:space-between"><button class="secondary" id="attPrev">이전 달</button><b>${y}년 ${m+1}월</b><button class="secondary" id="attNext">다음 달</button></div><div class="calendar">${cells}</div><p class="status">누적 출석 <b>${state.data.attendance.length}일</b> · 초록색으로 표시된 날짜가 출석한 날이에요.</p><button id="attClose">닫기</button>`);$('attPrev').onclick=()=>{month=new Date(y,m-1,1);render();};$('attNext').onclick=()=>{month=new Date(y,m+1,1);render();};$('attClose').onclick=close;}render();}
$('openDex').onclick=$('dex2').onclick=openDex;$('study').onclick=openStudy;$('attendanceView').onclick=openAttendance;$('map').onclick=openMap;$('settings').onclick=openSettings;$('save').onclick=()=>save();$('profile').onchange=()=>{save(true);state.profile=Number($('profile').value);load();dexPage=0;loadCompanion(state.data.companion);draw();$('message').textContent=`${state.profile===0?'하준이':'하늘이'} 모험 기록을 불러왔어요.`;};$('attendance').onclick=()=>{let d=new Date().toLocaleDateString('sv-SE');if(!state.data.attendance.includes(d)){state.data.attendance.push(d);save(true);$('message').textContent='오늘 출석 완료!';}openAttendance();};$('center').onclick=()=>$('message').textContent='방향 버튼을 길게 누르면 계속 이동해요.';
load();loadCompanion(state.data.companion);draw();
function animateFollower(ts){if(state.data?.companion&&follower){const dx=follower.tx-follower.x,dy=follower.ty-follower.y;follower.x+=dx*.18;follower.y+=dy*.18;follower.phase=ts/180;draw();}requestAnimationFrame(animateFollower);}requestAnimationFrame(animateFollower);
})();
</script></body></html>
