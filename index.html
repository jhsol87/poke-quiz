    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap');
        
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Jua', sans-serif;
            background-color: #0f172a;
            color: #1e293b;
            overflow: hidden;
        }

        .font-gaegu {
            font-family: 'Gaegu', cursive;
        }

        /* Pixel Canvas Fix */
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Custom Scrollbar for Modal content */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 8px;
        }

        /* Animated Pulse for Glowing Grass */
        @keyframes grassGlow {
            0% { filter: brightness(1) drop-shadow(0 0 2px #5eead4); }
            50% { filter: brightness(1.3) drop-shadow(0 0 8px #2dd4bf); }
            100% { filter: brightness(1) drop-shadow(0 0 2px #5eead4); }
        }
        .glow-grass {
            animation: grassGlow 1.5s infinite ease-in-out;
        }

        /* Pokeball Shake Animation */
        @keyframes pokeballShake {
            0% { transform: rotate(0deg); }
            20% { transform: rotate(-15deg); }
            40% { transform: rotate(15deg); }
            60% { transform: rotate(-10deg); }
            80% { transform: rotate(10deg); }
            100% { transform: rotate(0deg); }
        }
        .shake-ball {
            animation: pokeballShake 0.8s ease-in-out infinite;
        }
    </style>
</head>

    <!-- MAIN JAVASCRIPT LOGIC ARCHITECTURE -->
    <script>
    /**
     * ====================================================================
     *  AUDIO ENGINE (Web Audio API Synthesizer - Standalone No Asset Load)
     * ====================================================================
     */
    const AudioEngine = {
        ctx: null,
        soundEnabled: true,

        init() {
            if (!this.ctx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) this.ctx = new AudioCtx();
            }
        },

        toggleSound() {
            this.soundEnabled = !this.soundEnabled;
            const btn = document.getElementById('sound-toggle-btn');
            if (this.soundEnabled) {
                btn.innerHTML = '<i class="fa-solid fa-volume-high text-lg"></i>';
                btn.classList.replace('text-slate-500', 'text-amber-400');
                this.playTone(523.25, 0.1, 'sine');
            } else {
                btn.innerHTML = '<i class="fa-solid fa-volume-xmark text-lg"></i>';
                btn.classList.replace('text-amber-400', 'text-slate-500');
            }
            return this.soundEnabled;
        },

        playTone(freq, duration = 0.1, type = 'sine', gainVal = 0.15) {
            if (!this.soundEnabled || !this.ctx) return;
            try {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            } catch (e) { console.warn('Audio play error', e); }
        },

        playGrassRustle() {
            if (!this.soundEnabled) return;
            this.playTone(180, 0.08, 'triangle', 0.1);
            setTimeout(() => this.playTone(140, 0.08, 'triangle', 0.1), 50);
        },

        playEncounterSound() {
            if (!this.soundEnabled) return;
            const notes = [261.63, 329.63, 392.00, 523.25];
            notes.forEach((freq, idx) => {
                setTimeout(() => this.playTone(freq, 0.15, 'square', 0.2), idx * 80);
            });
        },

        playCorrect() {
            if (!this.soundEnabled) return;
            this.playTone(523.25, 0.1, 'sine', 0.2); // C5
            setTimeout(() => this.playTone(659.25, 0.1, 'sine', 0.2), 100); // E5
            setTimeout(() => this.playTone(783.99, 0.2, 'sine', 0.2), 200); // G5
        },

        playWrong() {
            if (!this.soundEnabled) return;
            this.playTone(200, 0.15, 'sawtooth', 0.2);
            setTimeout(() => this.playTone(150, 0.25, 'sawtooth', 0.2), 120);
        },

        playCatchSuccess() {
            if (!this.soundEnabled) return;
            const melody = [392, 523.25, 659.25, 783.99, 1046.50];
            melody.forEach((freq, idx) => {
                setTimeout(() => this.playTone(freq, 0.18, 'triangle', 0.25), idx * 100);
            });
        }
    };

    /**
     * ====================================================================
     *  DATA STRUCTURES: POKEMON & ECOSYSTEM REGIONS
     * ====================================================================
     */

    // PokéAPI Data Helper & 151 + 30 Special Master Database Generator

        else if (id % 5 === 0) rarity = 'rare';

        // Assign primary type based on ID sequence for diversity
        const typesList = Object.keys(POKEMON_TYPES);
        const primaryType = typesList[id % typesList.length];

        return {
            id,
            name,
            rarity, // common, rare, epic, legendary
            type: primaryType,
            sprite: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`,

    const QuestionBank = {
        generateQuestion(domain, difficulty) {
            // domain: 'math', 'korean', 'english', 'creativity'
            // difficulty: 'easy' (Haneul: early kids), 'hard' (Hajun: late kindergarten)
            
            if (domain === 'math') return this.getMathQuestion(difficulty);
            if (domain === 'korean') return this.getKoreanQuestion(difficulty);
            if (domain === 'english') return this.getEnglishQuestion(difficulty);
            return this.getCreativityQuestion(difficulty);
        },

        getMathQuestion(diff) {
            if (diff === 'easy') {
                const a = Math.floor(Math.random() * 5) + 1;
                const b = Math.floor(Math.random() * 5) + 1;
                const isAdd = Math.random() > 0.3;
                if (isAdd) {
                    const ans = a + b;
                    const opts = this.makeOptions(ans);
                    return { question: `${a} + ${b} 은(는) 얼마일까요?`, options: opts, answer: ans };
                } else {
                    const max = Math.max(a, b);
                    const min = Math.min(a, b);
                    const ans = max - min;
                    const opts = this.makeOptions(ans);
                    return { question: `${max} - ${min} 은(는) 얼마일까요?`, options: opts, answer: ans };
                }
            } else {
                // Harder for Hajun: 2-digit sums or multiplication concept
                const isMult = Math.random() > 0.6;
                if (isMult) {
                    const a = Math.floor(Math.random() * 4) + 2;
                    const ans = a * 2;
                    const opts = this.makeOptions(ans);
                    return { question: `${a}를 두 번 더하면 (${a} + ${a}) 얼마일까요?`, options: opts, answer: ans };
                } else {
                    const a = Math.floor(Math.random() * 10) + 5;
                    const b = Math.floor(Math.random() * 10) + 2;
                    const ans = a + b;
                    const opts = this.makeOptions(ans);
                    return { question: `${a} + ${b} 은(는) 얼마일까요?`, options: opts, answer: ans };
                }
            }
        },

        getKoreanQuestion(diff) {
            const easyList = [
                { q: "노랗고 길쭉한 달콤한 과일은 무엇일까요?", a: "바나나", wrong: ["사과", "수박", "포도"] },
                { q: "'강아지' 낱말의 첫 글자는 무엇일까요?", a: "강", wrong: ["아", "지", "고"] },
                { q: "비가 올 때 쓰는 물건은 무엇일까요?", a: "우산", wrong: ["장갑", "모자", "신발"] },

                { q: "'사과' 낱말의 첫 글자는 무엇일까요?", a: "사", wrong: ["과", "아", "나"] }
            ];

            const hardList = [
                { q: "다음 중 하늘을 날 수 있는 동물은 무엇일까요?", a: "독수리", wrong: ["거북이", "돼지", "지렁이"] },
                { q: "'반짝반짝 작은 ★' 문장에 들어갈 낱말은?", a: "별", wrong: ["달", "해", "구름"] },
                { q: "손을 깨끗이 씻을 때 사용하는 것은 무엇일까요?", a: "비누", wrong: ["연필", "지우개", "가방"] },
                { q: "'참새'라는 낱말의 첫소리 자음은 무엇일까요?", a: "ㅊ", wrong: ["ㄱ", "ㄴ", "ㅂ"] },
                { q: "캄캄한 밤에 하늘에 뜬 노란 동그라미는?", a: "보름달", wrong: ["무지개", "바람", "안개"] }
            ];

            const pool = diff === 'easy' ? easyList : hardList;
            const item = pool[Math.floor(Math.random() * pool.length)];
            const opts = this.shuffleArray([item.a, ...item.wrong]);
            return { question: item.q, options: opts, answer: item.a };
        },

        getEnglishQuestion(diff) {
            const easyWords = [
                { q: "'사과'를 뜻하는 영어 단어는 무엇일까요?", a: "APPLE", wrong: ["BANANA", "CAT", "DOG"] },
                { q: "'개(강아지)'를 뜻하는 영어 단어는?", a: "DOG", wrong: ["CAT", "FISH", "BIRD"] },
                { q: "'빨간색'을 뜻하는 영어 단어는?", a: "RED", wrong: ["BLUE", "YELLOW", "GREEN"] },
                { q: "숫자 '1'을 뜻하는 영어 단어는?", a: "ONE", wrong: ["TWO", "THREE", "FOUR"] },
                { q: "'고양이'를 뜻하는 영어 단어는?", a: "CAT", wrong: ["PIG", "DUCK", "LION"] }
            ];

            const hardWords = [
                { q: "'YELLOW'는 무슨 색깔일까요?", a: "노란색", wrong: ["파란색", "검은색", "보라색"] },
                { q: "'WATER'는 무엇을 뜻할까요?", a: "물", wrong: ["불", "돌", "바람"] },
                { q: "날씨 중 'SUNNY'는 어떤 날씨일까요?", a: "화창한 날씨", wrong: ["비오는 날씨", "눈오는 날씨", "바람부는 날씨"] },
                { q: "'MOTHER'는 가족 중 누구를 뜻할까요?", a: "엄마", wrong: ["아빠", "동생", "할아버지"] },
                { q: "'SCHOOL'은 어디를 뜻할까요?", a: "학교", wrong: ["공원", "병원", "마트"] }
            ];

            const pool = diff === 'easy' ? easyWords : hardWords;
            const item = pool[Math.floor(Math.random() * pool.length)];
            const opts = this.shuffleArray([item.a, ...item.wrong]);
            return { question: item.q, options: opts, answer: item.a };
        },

        getCreativityQuestion(diff) {
            const list = [
                { q: "귀가 길쭉하고 깡충깡충 뛰어다니는 동물은?", a: "토끼", wrong: ["곰", "소", "사자"] },
                { q: "빨강 -> 파랑 -> 빨강 -> 파랑... 다음에 올 색은?", a: "빨강", wrong: ["파랑", "노랑", "초록"] },
                { q: "추운 겨울 외출할 때 입어야 하는 옷은?", a: "두꺼운 코트", wrong: ["수영복", "반바지", "얇은 셔츠"] },
                { q: "물고기가 살기에 가장 좋은 장소는 어디일까요?", a: "맑은 호수", wrong: ["모래사장", "나무 위", "불길 속"] },
                { q: "횡단보도를 건널 때 신호등이 무슨 색일 때 건널까요?", a: "초록불", wrong: ["빨간불", "노란불", "파란불"] },
                { q: "밤에 잠을 잘 때 해야 하는 바른 행동은?", a: "불을 끄고 누워서 잔다", wrong: ["신나게 뛰어논다", "사탕을 먹는다", "TV를 켠다"] }
            ];

            const item = list[Math.floor(Math.random() * list.length)];
            const opts = this.shuffleArray([item.a, ...item.wrong]);
            return { question: item.q, options: opts, answer: item.a };
        },

        makeOptions(correctNum) {
            const set = new Set([correctNum]);
            while (set.size < 4) {
                const diff = (Math.floor(Math.random() * 5) + 1) * (Math.random() > 0.5 ? 1 : -1);
                const val = Math.max(1, correctNum + diff);
                set.add(val);
            }
            return this.shuffleArray(Array.from(set));
        },

        shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }
    };

        // Profile Storage Handler
        getStorageKey(profileKey) {
            return `pokemon_kids_game_v1_${profileKey}`;
        },

        loadProfileData(profileKey) {
            const raw = localStorage.getItem(this.getStorageKey(profileKey));
            if (raw) {
                try { return JSON.parse(raw); } catch (e) { console.error(e); }
            }
            // Default Profile Setup
            return {
                profileKey,
                name: profileKey === 'hajun' ? '하준이' : '하늘이',
                difficulty: profileKey === 'hajun' ? 'hard' : 'easy',
                caughtIds: [],

                posX: 600,
                posY: 600,
                lastRegionId: 'forest',
                visitedRegions: ['forest']
            };

        saveCurrentProfileData() {
            if (!this.activeProfile) return;
            this.profileData.posX = Math.round(this.player.x);
            this.profileData.posY = Math.round(this.player.y);

            localStorage.setItem(this.getStorageKey(this.activeProfile), JSON.stringify(this.profileData));

            ['hajun', 'haneul'].forEach(pk => {
                const data = this.loadProfileData(pk);

            // Record Today's Attendance

            // Set Player Initial Specs
            this.player.x = this.profileData.posX || 600;
            this.player.y = this.profileData.posY || 600;

            // UI Adjustments
            document.getElementById('profile-modal').classList.add('hidden');
            document.getElementById('top-header').classList.remove('hidden');
            document.getElementById('dpad-container').classList.remove('hidden');
            document.getElementById('minimap-container').classList.remove('hidden');

            document.getElementById('player-name-display').innerText = this.profileData.name;
            document.getElementById('player-avatar-badge').innerText = this.profileData.name[0];

            this.showToast(`환영합니다, ${this.profileData.name}! 오늘도 모험을 시작해요!`);
        },

        openProfileSelect() {
            this.saveCurrentProfileData();
            this.updateProfileSelectionStats();
            document.getElementById('profile-modal').classList.remove('hidden');
        },

        /**
         * ====================================================================
         *  OPEN WORLD & MAP GENERATION
         * ====================================================================
         */
        generateWorldGrassPatches() {
            this.grassPatches = [];
            // Spawn ~300 grass patches across the 9 regions
            ECOSYSTEM_REGIONS.forEach(region => {
                const numPatches = 35;
                for (let i = 0; i < numPatches; i++) {
                    const gx = region.bounds.minX + Math.random() * (region.bounds.maxX - region.bounds.minX - 120) + 60;
                    const gy = region.bounds.minY + Math.random() * (region.bounds.maxY - region.bounds.minY - 120) + 60;
                    const isGlowing = Math.random() < 0.2; // 20% Special Glowing Grass
                    this.grassPatches.push({
                        x: gx,
                        y: gy,
                        w: 90,
                        h: 90,
                        isGlowing,
                        regionId: region.id
                    });
                }
            });
        },

        setupControls() {
            window.addEventListener('keydown', e => {
                if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','W','A','S','D'].includes(e.key)) {
                    this.keys[e.key.toLowerCase()] = true;
                }
            });
            window.addEventListener('keyup', e => {
                if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','W','A','S','D'].includes(e.key)) {
                    this.keys[e.key.toLowerCase()] = false;
                }
            });

            // Virtual D-Pad Touch Listeners
            const btnMap = { 'btn-up': 'up', 'btn-down': 'down', 'btn-left': 'left', 'btn-right': 'right' };
            Object.keys(btnMap).forEach(btnId => {
                const el = document.getElementById(btnId);
                const dir = btnMap[btnId];
                const startFunc = (e) => { e.preventDefault(); this.touchDir[dir] = true; };
                const endFunc = (e) => { e.preventDefault(); this.touchDir[dir] = false; };
                el.addEventListener('touchstart', startFunc);
                el.addEventListener('touchend', endFunc);
                el.addEventListener('mousedown', startFunc);
                el.addEventListener('mouseup', endFunc);
            });
        },

        updatePlayerMovement() {
            if (!this.activeProfile || this.activePokemon) return;

            let dx = 0;
            let dy = 0;

            if (this.keys['arrowup'] || this.keys['w'] || this.touchDir.up) dy -= 1;
            if (this.keys['arrowdown'] || this.keys['s'] || this.touchDir.down) dy += 1;
            if (this.keys['arrowleft'] || this.keys['a'] || this.touchDir.left) dx -= 1;
            if (this.keys['arrowright'] || this.keys['d'] || this.touchDir.right) dx += 1;

            if (dx !== 0 || dy !== 0) {
                // Normalize diagonal move speed
                const len = Math.hypot(dx, dy);
                dx = (dx / len) * this.player.speed;
                dy = (dy / len) * this.player.speed;

                const nextX = Math.max(20, Math.min(this.worldWidth - 20, this.player.x + dx));
                const nextY = Math.max(20, Math.min(this.worldHeight - 20, this.player.y + dy));

                this.player.x = nextX;
                this.player.y = nextY;
                this.player.isMoving = true;

                if (Math.abs(dx) > Math.abs(dy)) this.player.dir = dx > 0 ? 'right' : 'left';
                else this.player.dir = dy > 0 ? 'down' : 'up';

                // Detect current ecosystem region
                this.detectCurrentRegion();

                // Check Grass Collisions & Random Pokemon Encounter
                this.checkGrassEncounter();
            } else {
                this.player.isMoving = false;
            }
        },

        detectCurrentRegion() {
            const current = ECOSYSTEM_REGIONS.find(r => 
                this.player.x >= r.bounds.minX && this.player.x < r.bounds.maxX &&
                this.player.y >= r.bounds.minY && this.player.y < r.bounds.maxY
            );
            if (current && current.id !== this.currentRegion.id) {
                this.currentRegion = current;
                document.getElementById('current-region-display').innerText = current.name;
                if (!this.profileData.visitedRegions.includes(current.id)) {
                    this.profileData.visitedRegions.push(current.id);
                }
                this.showToast(`✨ 새로운 생태 지역: ${current.name}에 들어섰습니다!`);
                this.saveCurrentProfileData();
            }
        },

        checkGrassEncounter() {
            if (this.encounterCooldown > 0) {
                this.encounterCooldown--;
                return;
            }

            // Check if player is inside any grass patch
            const inGrass = this.grassPatches.find(g => 
                this.player.x >= g.x && this.player.x <= g.x + g.w &&
                this.player.y >= g.y && this.player.y <= g.y + g.h
            );

            if (inGrass) {
                AudioEngine.playGrassRustle();
                // Base chance calculation (5-10 sec average)
                this.encounterRateBoost += 0.002;
                const baseProb = inGrass.isGlowing ? 0.08 : 0.03;
                if (Math.random() < (baseProb + this.encounterRateBoost)) {
                    this.triggerWildEncounter(inGrass);
                }
            } else {
                this.encounterRateBoost = 0;
            }
        },

        triggerWildEncounter(grassPatch) {
            this.encounterCooldown = 180; // 3 sec cooldown
            this.encounterRateBoost = 0;
            AudioEngine.playEncounterSound();

            // Filter Pokemon candidate by region types & grass glowing state
            const matchedTypes = [...this.currentRegion.primaryTypes, ...this.currentRegion.secondaryTypes];
            let pool = POKEMON_MASTER.filter(p => matchedTypes.includes(p.type));
            if (pool.length === 0) pool = POKEMON_MASTER;

            // Pick Pokemon based on rarity weights
            if (grassPatch.isGlowing) {
                const rarePool = pool.filter(p => p.rarity !== 'common');
                this.activePokemon = rarePool.length > 0 ? rarePool[Math.floor(Math.random() * rarePool.length)] : pool[0];
            } else {
                this.activePokemon = pool[Math.floor(Math.random() * pool.length)];
            }

            this.startQuizSession();
        },

        /**
         * ====================================================================
         *  QUIZ & ENCOUNTER LOGIC SYSTEM
         * ====================================================================
         */
        startQuizSession() {
            this.encounterStep = 1; // Step 1: Guess Name
            this.heartsLeft = 3;
            this.requiredQuizzes = (this.activePokemon.rarity === 'common') ? 2 : 4;
            this.quizIndex = 0;

            const modal = document.getElementById('quiz-modal');
            const img = document.getElementById('quiz-pokemon-img');
            const badge = document.getElementById('encounter-rarity-badge');
            const typeContainer = document.getElementById('encounter-types');
            const shinyBg = document.getElementById('shiny-sparkle-bg');

            img.src = this.activePokemon.sprite;
            img.onerror = () => { img.src = this.activePokemon.fallbackSprite; };
            img.classList.add('brightness-0'); // Silhouette

            // Rarity Badge Text
            const rarityNames = { common: '일반 포켓몬', rare: '희귀 포켓몬', epic: '전설급 포켓몬', legendary: '환상의 포켓몬' };
            badge.innerText = rarityNames[this.activePokemon.rarity] || '야생 포켓몬';
            badge.className = `absolute top-3 left-3 px-3 py-1 rounded-full text-xs font-bold text-white shadow ${this.activePokemon.rarity !== 'common' ? 'bg-amber-500 animate-bounce' : 'bg-slate-700'}`;

            if (this.activePokemon.rarity !== 'common') shinyBg.classList.remove('hidden');
            else shinyBg.classList.add('hidden');

            // Type Badges Render
            const typeObj = POKEMON_TYPES[this.activePokemon.type] || { name: '노말', color: 'bg-slate-500' };
            typeContainer.innerHTML = `<span class="${typeObj.color} text-white px-2.5 py-0.5 rounded-full text-xs font-bold">${typeObj.name}</span>`;

            this.updateHeartsDisplay();
            this.renderStep1NameQuiz();

            modal.classList.remove('hidden');
        },

        updateHeartsDisplay() {
            const container = document.getElementById('heart-container');
            let html = '';
            for (let i = 0; i < 3; i++) {
                if (i < this.heartsLeft) html += '<i class="fa-solid fa-heart text-rose-500"></i>';
                else html += '<i class="fa-regular fa-heart text-slate-600"></i>';
            }
            container.innerHTML = html;
        },

        renderStep1NameQuiz() {
            document.getElementById('quiz-step-title').innerHTML = '<i class="fa-solid fa-circle-question"></i> STEP 1: 포켓몬 실루엣의 이름을 맞춰라!';
            document.getElementById('quiz-question-text').innerText = '이 포켓몬의 이름은 무엇일까요?';
            document.getElementById('quiz-pokemon-name-reveal').classList.add('hidden');

            // Build 4 choices (1 correct, 3 random wrong)
            const correctName = this.activePokemon.name;
            const wrongCandidates = POKEMON_MASTER.filter(p => p.name !== correctName).map(p => p.name);
            QuestionBank.shuffleArray(wrongCandidates);

            const options = QuestionBank.shuffleArray([correctName, wrongCandidates[0], wrongCandidates[1], wrongCandidates[2]]);
            const grid = document.getElementById('quiz-options-container');
            grid.innerHTML = '';

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'w-full py-4 bg-slate-800 hover:bg-slate-700 active:bg-amber-500 text-white font-black text-xl rounded-2xl border-2 border-slate-600 shadow transition flex items-center justify-center';
                btn.innerText = opt;
                btn.onclick = () => this.handleStep1Answer(opt, btn);
                grid.appendChild(btn);
            });
        },

        handleStep1Answer(chosenName, btnEl) {
            if (chosenName === this.activePokemon.name) {
                // Correct Name!
                AudioEngine.playCorrect();
                btnEl.className = 'w-full py-4 bg-emerald-600 text-white font-black text-xl rounded-2xl border-2 border-emerald-300 shadow animate-pulse flex items-center justify-center';
                
                // Reveal Sprite
                const img = document.getElementById('quiz-pokemon-img');
                img.classList.remove('brightness-0');
                const nameReveal = document.getElementById('quiz-pokemon-name-reveal');
                nameReveal.innerText = `[ ${this.activePokemon.name} ]`;
                nameReveal.classList.remove('hidden');

                setTimeout(() => {
                    this.prepareStep2AcademicQuiz();
                }, 1200);
            } else {
                // Wrong Choice
                AudioEngine.playWrong();
                this.heartsLeft--;
                this.updateHeartsDisplay();
                btnEl.disabled = true;
                btnEl.className = 'w-full py-4 bg-slate-900 text-slate-600 font-bold text-lg rounded-2xl border border-slate-800 opacity-50 cursor-not-allowed';

                if (this.heartsLeft <= 0) {
                    this.showToast('포켓몬이 도망쳐 버렸습니다! 다음 기회에...');
                    setTimeout(() => {
                        document.getElementById('quiz-modal').classList.add('hidden');
                        this.activePokemon = null;
                    }, 1200);
                }
            }
        },

        prepareStep2AcademicQuiz() {
            this.encounterStep = 2;
            document.getElementById('heart-container').innerHTML = `<span class="text-xs text-amber-300 font-bold bg-amber-900/60 px-2 py-1 rounded-lg">남은 문제: ${this.requiredQuizzes - this.quizIndex}</span>`;

            // Prepare question list from 4 domains
            const domains = ['math', 'korean', 'english', 'creativity'];
            const diff = this.profileData.difficulty || 'easy';
            
            this.currentQuestions = [];
            for (let i = 0; i < this.requiredQuizzes; i++) {
                const domain = domains[i % domains.length];
                this.currentQuestions.push(QuestionBank.generateQuestion(domain, diff));
            }

            this.renderStep2Question();
        },

        renderStep2Question() {
            const qObj = this.currentQuestions[this.quizIndex];
            document.getElementById('quiz-step-title').innerHTML = `<i class="fa-solid fa-graduation-cap"></i> STEP 2: 학습 퀴즈 풀기 (${this.quizIndex + 1} / ${this.requiredQuizzes})`;
            document.getElementById('quiz-question-text').innerText = qObj.question;

            const grid = document.getElementById('quiz-options-container');
            grid.innerHTML = '';

            qObj.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'w-full py-4 bg-slate-800 hover:bg-slate-700 active:bg-amber-500 text-white font-black text-xl rounded-2xl border-2 border-slate-600 shadow transition flex items-center justify-center';
                btn.innerText = opt;
                btn.onclick = () => this.handleStep2Answer(opt, qObj.answer, btn);
                grid.appendChild(btn);
            });
        },

        handleStep2Answer(chosen, correct, btnEl) {
            if (String(chosen) === String(correct)) {
                AudioEngine.playCorrect();
                btnEl.className = 'w-full py-4 bg-emerald-600 text-white font-black text-xl rounded-2xl border-2 border-emerald-300 shadow flex items-center justify-center';

                this.quizIndex++;
                if (this.quizIndex >= this.requiredQuizzes) {
                    setTimeout(() => {
                        document.getElementById('quiz-modal').classList.add('hidden');
                        this.startCatchAnimation();
                    }, 800);
                } else {
                    document.getElementById('heart-container').innerHTML = `<span class="text-xs text-amber-300 font-bold bg-amber-900/60 px-2 py-1 rounded-lg">남은 문제: ${this.requiredQuizzes - this.quizIndex}</span>`;
                    setTimeout(() => this.renderStep2Question(), 800);
                }
            } else {
                AudioEngine.playWrong();
                btnEl.className = 'w-full py-4 bg-rose-900/80 text-rose-200 font-bold text-lg rounded-2xl border border-rose-500';
                this.showToast(`다시 한번 생각해보세요! 정답은 [ ${correct} ] 이예요.`);
            }
        },

        /**
         * ====================================================================
         *  POKEBALL CATCH ANIMATION SYSTEM
         * ====================================================================
         */
        startCatchAnimation() {
            const modal = document.getElementById('catch-modal');
            const targetImg = document.getElementById('catch-target-pokemon');
            const ballEl = document.getElementById('pokeball-anim-element');
            const statusText = document.getElementById('catch-status-text');
            const successCard = document.getElementById('catch-success-card');

            targetImg.src = this.activePokemon.sprite;
            targetImg.classList.remove('scale-0');
            targetImg.classList.add('scale-100');

            ballEl.classList.add('opacity-0', 'scale-50');
            ballEl.classList.remove('shake-ball');
            successCard.classList.add('hidden');
            statusText.innerText = '몬스터볼 던지는 중...';

            modal.classList.remove('hidden');

            // Sequence Timeline
            setTimeout(() => {
                // Ball flies in
                ballEl.classList.remove('opacity-0');
                ballEl.classList.add('scale-100');
            }, 300);

            setTimeout(() => {
                // Pokemon sucked into ball
                targetImg.classList.add('scale-0');
            }, 1000);

            setTimeout(() => {
                // Ball shakes
                ballEl.classList.add('shake-ball');
                AudioEngine.playTone(300, 0.1, 'sine');
            }, 1800);

            setTimeout(() => {
                // Catch Completed!
                ballEl.classList.remove('shake-ball');
                AudioEngine.playCatchSuccess();
                statusText.innerText = '잡았다!';
                
                // Add to Profile Storage
                if (!this.profileData.caughtIds.includes(this.activePokemon.id)) {
                    this.profileData.caughtIds.push(this.activePokemon.id);
                    this.saveCurrentProfileData();
                }

                document.getElementById('caught-pokemon-name').innerText = `${this.activePokemon.name} 포획 성공!`;
                successCard.classList.remove('hidden');
            }, 3000);
        },

        closeCatchModal() {
            document.getElementById('catch-modal').classList.add('hidden');
            this.activePokemon = null;
        },

                    <span class="font-bold text-xs text-center">${isCaught ? p.name : '???'}</span>

        renderAttendanceCalendar() {
            const year = this.calendarDate.getFullYear();
            const month = this.calendarDate.getMonth();
            document.getElementById('calendar-month-year').innerText = `${year}년 ${month + 1}월`;

            const grid = document.getElementById('calendar-days-grid');

            const firstDay = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            // Empty Leading Slots
            for (let i = 0; i < firstDay; i++) {
                grid.appendChild(document.createElement('div'));

            const attendanceMap = this.profileData.attendance || {};

            for (let d = 1; d <= totalDays; d++) {
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const isChecked = !!attendanceMap[dateKey];

                const dayCell = document.createElement('div');
                dayCell.className = `h-10 rounded-xl flex items-center justify-center font-bold text-sm relative border ${
                    isChecked ? 'bg-amber-500/20 border-amber-400 text-amber-300' : 'bg-slate-800/50 border-slate-700 text-slate-400'

                    stamp.innerHTML = '<i class="fa-solid fa-stamp animate-bounce"></i>';
                    dayCell.appendChild(stamp);

                grid.appendChild(dayCell);

            grid.innerHTML = '';

        /**
         * ====================================================================
         *  MAIN CANVAS WORLD GRAPHICS & RENDERING ENGINE
         * ====================================================================
         */
        gameLoop(timestamp) {
            this.updatePlayerMovement();
            this.renderWorld();
            this.renderMinimap();
            requestAnimationFrame((time) => this.gameLoop(time));
        },

        renderWorld() {
            const ctx = this.ctx;
            const w = this.canvas.width;
            const h = this.canvas.height;

            // Camera offset centering on player
            const camX = this.player.x - w / 2;
            const camY = this.player.y - h / 2;

            ctx.clearRect(0, 0, w, h);

            // Draw World Ecosystem Grid & Terrain Backgrounds
            ECOSYSTEM_REGIONS.forEach(r => {
                // Check if region is visible in viewport
                if (r.bounds.maxX >= camX && r.bounds.minX <= camX + w &&
                    r.bounds.maxY >= camY && r.bounds.minY <= camY + h) {
                    
                    const rx = r.bounds.minX - camX;
                    const ry = r.bounds.minY - camY;
                    const rw = r.bounds.maxX - r.bounds.minX;
                    const rh = r.bounds.maxY - r.bounds.minY;

                    ctx.fillStyle = r.bg;
                    ctx.fillRect(rx, ry, rw, rh);

                    // Region Border Outlines
                    ctx.strokeStyle = r.accent;
                    ctx.lineWidth = 4;
                    ctx.strokeRect(rx, ry, rw, rh);

                    // Region Name Label Overlay
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                    ctx.font = 'bold 36px Jua';
                    ctx.fillText(r.name, rx + 40, ry + 60);
                }
            });

            // Draw Grass Patches
            this.grassPatches.forEach(g => {
                if (g.x + g.w >= camX && g.x <= camX + w &&
                    g.y + g.h >= camY && g.y <= camY + h) {
                    
                    const gx = g.x - camX;
                    const gy = g.y - camY;

                    ctx.fillStyle = g.isGlowing ? '#2dd4bf' : '#22c55e';
                    ctx.beginPath();
                    ctx.roundRect(gx, gy, g.w, g.h, 12);
                    ctx.fill();

                    // Grass blade details
                    ctx.fillStyle = g.isGlowing ? '#fef08a' : '#15803d';
                    for (let bx = 10; bx < g.w; bx += 20) {
                        ctx.fillRect(gx + bx, gy + 10, 6, 25);
                        ctx.fillRect(gx + bx + 5, gy + 35, 6, 25);
                    }
                }
            });

            // Draw Player Character Sprite Avatar
            const px = this.player.x - camX;
            const py = this.player.y - camY;

            // Player Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.beginPath();
            ctx.ellipse(px, py + 14, 16, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            // Character Head/Body Graphics
            const avatarColor = this.activeProfile === 'hajun' ? '#3b82f6' : '#ec4899';
            ctx.fillStyle = avatarColor;
            ctx.beginPath();
            ctx.arc(px, py, this.player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            // Face Details
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(px - 5, py - 3, 3, 0, Math.PI * 2);
            ctx.arc(px + 5, py - 3, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(px - 5, py - 3, 1.5, 0, Math.PI * 2);
            ctx.arc(px + 5, py - 3, 1.5, 0, Math.PI * 2);
            ctx.fill();
        },

        renderMinimap() {
            const mctx = this.minimapCtx;
            const mw = this.minimapCanvas.width;
            const mh = this.minimapCanvas.height;

            mctx.clearRect(0, 0, mw, mh);

            // Scale factor: World (3600x3600) -> Minimap (150x150)
            const scaleX = mw / this.worldWidth;
            const scaleY = mh / this.worldHeight;

            // Draw Regions on Minimap
            ECOSYSTEM_REGIONS.forEach(r => {
                mctx.fillStyle = r.bg;
                mctx.fillRect(
                    r.bounds.minX * scaleX,
                    r.bounds.minY * scaleY,
                    (r.bounds.maxX - r.bounds.minX) * scaleX,
                    (r.bounds.maxY - r.bounds.minY) * scaleY
                );
            });

            // Draw Player Position Dot
            mctx.fillStyle = '#f59e0b';
            mctx.beginPath();
            mctx.arc(this.player.x * scaleX, this.player.y * scaleY, 4, 0, Math.PI * 2);
            mctx.fill();
            mctx.strokeStyle = '#ffffff';
            mctx.lineWidth = 1.5;
            mctx.stroke();
        }
    };

    // Initialize Game Engine on Window Ready
    window.onload = function() {
        Game.init();
    };
    </script>
</body>
