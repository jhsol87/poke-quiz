<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pokémon Exploration School</title>
<style>
:root{--ink:#24334a;--blue:#3f83c9;--cream:#fff8e8;--green:#4d9b63;--gold:#f2c45e}
*{box-sizing:border-box}body{margin:0;background:#e9f3ff;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;overflow:hidden}
button{font:inherit;border:0;border-radius:14px;padding:12px 16px;background:#fff;color:var(--ink);font-weight:800;box-shadow:0 3px 0 #c8d6e5;cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #c8d6e5}button.primary{background:#ffcf5b}button.green{background:#80d39a}button:disabled{opacity:.5}
#app{height:100dvh;display:flex;flex-direction:column;max-width:1100px;margin:auto;padding:10px;gap:8px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{font-size:clamp(18px,3vw,26px);font-weight:1000;color:#2b659a;text-shadow:1px 2px #fff}
#hud{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{background:#fff;padding:7px 11px;border-radius:99px;font-size:13px;font-weight:800}
#stage{position:relative;flex:1;min-height:0;background:#b6dca2;border:5px solid #fff;border-radius:22px;overflow:hidden;box-shadow:0 5px 0 #c9d9e8}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:14px;background:#17324dbb;overflow:auto}
.panel{background:var(--cream);border:4px solid #fff;border-radius:24px;padding:clamp(16px,3vw,26px);width:min(640px,100%);max-height:100%;overflow:auto;box-shadow:0 8px 0 #8ca7bd;text-align:center}
.panel h1,.panel h2{margin:4px 0 12px}.panel p{line-height:1.55}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.choices button{min-height:58px;font-size:clamp(15px,2vw,19px)}
.subtle{font-size:13px;color:#61748a}.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
#controls{position:absolute;left:12px;bottom:12px;display:none;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,44px);gap:5px;opacity:.88}
#controls button{padding:0;font-size:20px;background:#ffffffd9;touch-action:none}
#controls .up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
#hint{position:absolute;left:12px;top:10px;background:#ffffffdd;padding:7px 10px;border-radius:12px;font-size:12px;font-weight:800}
#toast{position:absolute;top:48px;left:50%;transform:translateX(-50%);background:#fff5c8;padding:9px 15px;border-radius:20px;font-weight:900;display:none;white-space:nowrap}
.menuGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dexGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:left}
.dexItem{background:white;border-radius:10px;padding:7px;font-size:12px;min-height:54px}
.dexItem.lock{color:#9aa7b5;background:#e9edf1}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{padding:7px 2px;background:white;border-radius:8px;font-size:12px}.day.hit{background:#b6efc7;font-weight:900}
@media(max-width:700px){#app{padding:6px;gap:5px}#controls{display:grid}.menuGrid{grid-template-columns:repeat(2,1fr)}.dexGrid{grid-template-columns:repeat(3,1fr)}header{align-items:flex-start}#hud{max-width:70%}}

.silhouette-wrap{height:150px;display:flex;align-items:center;justify-content:center;margin:4px auto 10px}
.pokemon-silhouette{width:150px;height:150px;object-fit:contain;image-rendering:pixelated;filter:brightness(0) saturate(100%);transform:scale(1.12)}
.sprite-fallback{font-weight:900;color:#66788a;background:#e8edf2;border-radius:14px;padding:18px;line-height:1.6}
.sprite-fallback span{font-size:12px;font-weight:500}
</style>
</head>
<body>

<div id="controls">
<button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button>
</div>
<div id="overlay"><div class="panel" id="panel"></div></div>
</div>
</div>

function nameAnswer(answer){if(answer===encounter.name){say('정답이야! 포켓몬의 모습이 보여!');quizStep=0;nextQuestion();}else{hearts--;if(hearts<=0){show(`<h2>아쉽지만 포켓몬이 숲으로 돌아갔어.</h2><p>다음에는 꼭 만날 수 있을 거야!</p><button onclick="window.finishEncounter()">탐험 계속하기</button>`);screen='escaped';}else{say('괜찮아! 다시 골라 보자.');renderOverlay();}}}
function studyAnswer(answer){if(answer===activeQuestion.a){quizStep++;const needed=encounter.rare==='희귀'?4:2;if(quizStep>=needed){if(!save.caught.includes(encounter.id))save.caught.push(encounter.id);persist();screen='caught';renderOverlay();}else{say('잘했어! 다음 문제도 해보자.');nextQuestion();}}else{show(`<h2>거의 다 왔어! 💛</h2><p>정답은 <b>${activeQuestion.a}</b>야.</p><p>다시 한번 생각해 볼까?</p><button class="primary" onclick="window.retryQuestion()">다시 도전</button>`);}}
function retryQuestion(){screen='study';renderOverlay();}
function finishEncounter(){screen='world';encounter=null;encounterCooldown=2;hideOverlay();persist();}
function runAway(){screen='world';encounter=null;encounterCooldown=2;hideOverlay();}
function gameMenu(){show(`<h2>🎒 탐험 메뉴</h2><div class="menuGrid"><button onclick="window.showDex()">📖 포켓몬 도감</button><button onclick="window.showAttendance()">📅 출석 달력</button><button onclick="window.showSettings()">⚙️ 설정</button><button onclick="window.backWorld()">🌿 탐험으로</button><button onclick="window.startGame()">프로필 변경</button><button onclick="window.resetSave()">저장 초기화</button></div>`);}
function backWorld(){hideOverlay();screen='world';}
function showDex(){const caught=new Set(save.caught);show(`<h2>📖 포켓몬 도감</h2><p>수집 ${caught.size} / ${pokemon.length} · ${Math.round(caught.size/pokemon.length*100)}%</p><div class="dexGrid">${pokemon.map(p=>`<div class="dexItem ${caught.has(p.id)?'':'lock'}">${caught.has(p.id)?'⭐':'🔒'} #${String(p.id).padStart(3,'0')} ${caught.has(p.id)?p.name:'???'}<br><span class="subtle">${caught.has(p.id)?p.type:'미발견'}</span></div>`).join('')}</div><div class="row"><button onclick="window.gameMenu()">뒤로</button></div>`);}
function showAttendance(){const d=new Date(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),set=new Set(save.attendance);let cells='일월화수목금토'.split('').map(x=>`<div class="day"><b>${x}</b></div>`).join('');for(let i=0;i<first;i++)cells+='<div></div>';for(let i=1;i<=days;i++){let key=new Date(y,m,i).toLocaleDateString('sv-SE');cells+=`<div class="day ${set.has(key)?'hit':''}">${i}${set.has(key)?' ✓':''}</div>`;}show(`<h2>📅 ${y}년 ${m+1}월 출석</h2><div class="calendar">${cells}</div><p>누적 출석 ${save.attendance.length}일 · 연속 출석 ${streak()}일</p><button onclick="window.gameMenu()">뒤로</button>`);}
function streak(){let s=new Set(save.attendance),n=0,d=new Date();while(s.has(d.toLocaleDateString('sv-SE'))){n++;d.setDate(d.getDate()-1);}return n;}
function showSettings(){show(`<h2>⚙️ 설정</h2><p>학습 난이도</p><div class="row">${['쉬움','보통','어려움'].map(x=>`<button class="${save.difficulty===x?'primary':''}" onclick="window.setDifficulty('${x}')">${x}</button>`).join('')}</div><p>사운드</p><div class="row"><button onclick="window.toggleSound()">전체 사운드 ${save.sound?'켜짐':'꺼짐'}</button><button onclick="window.toggleMusic()">배경음악 ${save.music?'켜짐':'꺼짐'}</button><button onclick="window.toggleSfx()">효과음 ${save.sfx?'켜짐':'꺼짐'}</button></div><p class="subtle">브라우저에서 외부 음원을 사용하지 않으며 기본 게임은 무음으로도 플레이할 수 있어요.</p><button onclick="window.gameMenu()">뒤로</button>`);}
function resetSave(){if(confirm('이 프로필의 저장 데이터를 모두 지울까요?')){localStorage.removeItem('pokemon_save_'+profile);save=defaultSave();rebuildZones();persist();gameMenu();}}
function draw(){
 const m=regionMaps[save?.region||0],r=regions[save?.region||0];ctx.clearRect(0,0,960,600);
 if(!save){ctx.fillStyle='#9bd58b';ctx.fillRect(0,0,960,600);ctx.fillStyle='#315f42';ctx.font='bold 34px sans-serif';ctx.fillText('포켓몬 탐험학교',320,290);return;}
 const sx=Math.max(0,Math.min(m.W-960,save.x-480)),sy=Math.max(0,Math.min(m.H-600,save.y-300));save.cameraX=sx;save.cameraY=sy;
 ctx.fillStyle=r.theme;ctx.fillRect(0,0,960,600);
 // tiled ground speckles
 for(let x=0;x<960;x+=38)for(let y=0;y<600;y+=38){ctx.fillStyle=(Math.floor((x+sx)/38+(y+sy)/38)%2)?'#ffffff0a':'#00000008';ctx.fillRect(x,y,38,38);}
 // pathway
 ctx.fillStyle='#d8c99c';ctx.fillRect(42-sx,260-sy,1016,210);
 ctx.fillStyle='#c7b58a';ctx.fillRect(42-sx,270-sy,1016,5);
 // water pond / region signature
 if(save.region===2){ctx.fillStyle='#55b8d2';ctx.beginPath();ctx.ellipse(500-sx,130-sy,200,75,0,0,Math.PI*2);ctx.fill();}
 if(save.region===4){ctx.fillStyle='#4a5074';ctx.fillRect(300-sx,60-sy,440,110);}
 // grass clusters
 m.grass.forEach((g,i)=>{ctx.fillStyle=i%2?'#4f9c55':'#3f914d';ctx.fillRect(g.x-sx,g.y-sy,g.w,g.h);for(let x=g.x+5;x<g.x+g.w-5;x+=13)for(let y=g.y+5;y<g.y+g.h-5;y+=13){ctx.fillStyle=(x+y)%3?'#72bd62':'#2f8047';ctx.beginPath();ctx.moveTo(x-sx,y-sy+8);ctx.lineTo(x-sx+4,y-sy-3);ctx.lineTo(x-sx+8,y-sy+8);ctx.fill();}});
 // encounter grass shimmer
 sessionZones.forEach(z=>{ctx.strokeStyle='#fff3a8';ctx.lineWidth=3;ctx.strokeRect(z.x-sx+2,z.y-sy+2,z.w-4,z.h-4);});
 // walls and natural-looking boulders
 m.blocked.slice(4).forEach((b,i)=>{ctx.fillStyle=i%2?'#665d50':r.wall;ctx.fillRect(b.x-sx,b.y-sy,b.w,b.h);ctx.fillStyle='#ffffff22';ctx.fillRect(b.x-sx+5,b.y-sy+4,b.w-10,5);});
 // border trees
 for(let x=30;x<m.W;x+=55){tree(x-sx,22-sy);tree(x-sx,m.H-25-sy);}
 for(let y=70;y<m.H-50;y+=58){tree(20-sx,y-sy);tree(m.W-22-sx,y-sy);}
 // character
 const px=save.x-sx,py=save.y-sy;ctx.fillStyle='#26364a';ctx.beginPath();ctx.arc(px,py+2,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f3c49b';ctx.beginPath();ctx.arc(px,py-7,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e34e56';ctx.fillRect(px-10,py-18,20,7);ctx.fillStyle='#fff';ctx.fillRect(px-5,py-8,3,3);ctx.fillRect(px+3,py-8,3,3);
 ctx.fillStyle='#20334a';ctx.font='bold 16px sans-serif';ctx.fillText(r.name,20,30);
}
function tree(x,y){ctx.fillStyle='#654b35';ctx.fillRect(x-4,y+5,8,13);ctx.fillStyle='#286b45';ctx.beginPath();ctx.arc(x,y,17,0,Math.PI*2);ctx.fill();ctx.fillStyle='#438e55';ctx.beginPath();ctx.arc(x-6,y-5,8,0,Math.PI*2);ctx.fill();}
function loop(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;if(screen==='world'&&save){let dx=0,dy=0;if(keys.ArrowLeft||keys.a||keys.A)dx--;if(keys.ArrowRight||keys.d||keys.D)dx++;if(keys.ArrowUp||keys.w||keys.W)dy--;if(keys.ArrowDown||keys.s||keys.S)dy++;if(dx||dy){let n=Math.hypot(dx,dy);move(dx/n,dy/n,dt);persistThrottled(t);}}draw();requestAnimationFrame(loop);}
let lastSave=0;function persistThrottled(t){if(t-lastSave>1400){lastSave=t;persist();}}
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;});document.addEventListener('keyup',e=>keys[e.key]=false);
document.querySelectorAll('#controls button').forEach(b=>{const dir=b.dataset.dir,map={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'};b.addEventListener('pointerdown',e=>{e.preventDefault();keys[map[dir]]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[map[dir]]=false));});
window.chooseProfile=loadProfile;window.nameAnswer=nameAnswer;window.studyAnswer=studyAnswer;window.retryQuestion=retryQuestion;window.finishEncounter=finishEncounter;window.runAway=runAway;window.gameMenu=gameMenu;window.showDex=showDex;window.showAttendance=showAttendance;window.showSettings=showSettings;window.backWorld=backWorld;window.startGame=startGame;window.resetSave=resetSave;
window.setDifficulty=x=>{save.difficulty=x;persist();showSettings();};window.toggleSound=()=>{save.sound=!save.sound;persist();showSettings();};window.toggleMusic=()=>{save.music=!save.music;persist();showSettings();};window.toggleSfx=()=>{save.sfx=!save.sfx;persist();showSettings();};
startGame();requestAnimationFrame(loop);
})();
</script>
</body></html>
