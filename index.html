<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>포켓몬 퀴즈 모험</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 구글 폰트: 주아 (Jua) / 가독성 높은 동글동글한 카툰 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Jua', sans-serif, system-ui;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            overflow: hidden;
        }
        /* 실루엣 효과 (CSS Filter) */
        .silhouette {
            filter: brightness(0) drop-shadow(0 0 10px rgba(0,0,0,0.5));
        }
        /* 버튼 3D 누름 효과 */
        .btn-push {
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0px 6px 0px rgba(0,0,0,0.25);
        }
        .btn-push:active {
            transform: translateY(4px);
            box-shadow: 0px 2px 0px rgba(0,0,0,0.25);
        }
        /* 도장 효과 */
        .stamp-animation {
            animation: stampPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes stampPop {
            0% { transform: scale(3) rotate(-15deg); opacity: 0; }
            100% { transform: scale(1) rotate(-5deg); opacity: 1; }
        }
        /* 몬스터볼 통통 튀는 애니메이션 */
        .ball-bounce {
            animation: bounce 1.2s infinite ease-in-out alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-center items-center relative overflow-hidden bg-slate-900">

    <!-- 글로벌 사운드 컨트롤 (상단 우측) -->
    <div class="absolute top-3 right-3 z-50 flex gap-2">
        <button id="soundToggleBtn" onclick="toggleSound()" class="bg-yellow-400 hover:bg-yellow-300 text-slate-900 text-lg sm:text-xl font-bold px-4 py-2 rounded-full border-4 border-white shadow-lg btn-push flex items-center gap-2">
            <i class="fa-solid fa-volume-high" id="soundIcon"></i> <span id="soundTxt">소리 ON</span>
        </button>
    </div>

    <!-- 1. 타이틀 화면 -->
    <div id="screen-title" class="w-full h-full flex flex-col items-center justify-center p-4 bg-gradient-to-b from-sky-400 via-sky-200 to-indigo-600 relative z-40">
        <!-- 타이틀 제목 및 로고 -->
        <div class="text-center mb-6">
            <div class="inline-block bg-yellow-400 border-8 border-blue-600 rounded-3xl px-6 py-3 shadow-2xl transform -rotate-1 mb-2">
                <h1 class="text-4xl sm:text-6xl text-blue-600 tracking-wider drop-shadow-[0_4px_0_#fff]">포켓몬 퀴즈 모험</h1>
            </div>
            <p class="text-white text-xl sm:text-2xl drop-shadow-[0_2px_4px_rgba(0,0,0,0.6)]">퀴즈를 맞히고 전설의 포켓몬을 모두 모아봐!</p>
        </div>

        <!-- 캐릭터 및 몬스터볼 장식 -->
        <div class="flex items-center gap-6 mb-8">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" class="w-28 sm:w-40 h-28 sm:h-40 ball-bounce drop-shadow-xl" alt="피카츄">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png" class="w-28 sm:w-40 h-28 sm:h-40 ball-bounce drop-shadow-xl" style="animation-delay: 0.3s;" alt="리자몽">
        </div>

        <!-- 메인 메뉴 버튼들 -->
        <div class="flex flex-col sm:flex-row gap-4 w-full max-w-md px-4">
            <button onclick="showRegionSelect()" class="flex-1 bg-green-500 hover:bg-green-400 text-white text-2xl font-bold py-4 rounded-2xl border-4 border-white shadow-2xl btn-push flex items-center justify-center gap-2">

            <button onclick="openPokedex()" class="flex-1 bg-red-500 hover:bg-red-400 text-white text-2xl font-bold py-4 rounded-2xl border-4 border-white shadow-2xl btn-push flex items-center justify-center gap-2">

        <button onclick="openAttendanceModal()" class="mt-4 bg-purple-500 hover:bg-purple-400 text-white text-xl font-bold px-6 py-2 rounded-full border-4 border-white shadow-lg btn-push flex items-center gap-2">

            <!-- 도시 -->

        <!-- 필드 상단 UI Bar -->

            <!-- 타입 태그 -->
            <div id="pokeTypeTags" class="flex gap-2 mb-2 hidden"></div>

            <!-- 포켓몬 이미지 (실루엣 or 공개) -->
            <div class="relative flex items-center justify-center">
                <img id="battlePokeImg" src="" class="w-44 sm:w-64 h-44 sm:h-64 object-contain transition-all duration-500 silhouette" alt="포켓몬">

                <button onclick="handleAnswerChoice(3)" class="quiz-opt-btn bg-blue-600 hover:bg-blue-500 text-white text-xl sm:text-2xl font-bold py-3 px-4 rounded-2xl border-2 border-blue-300 btn-push flex items-center justify-start gap-2">
                    <span class="bg-blue-800 text-yellow-300 text-base px-2 py-0.5 rounded-lg">4</span> <span class="opt-text flex-1 text-center">보기 4</span>

    </div>

    <!-- 5. 포켓몬 도감 화면 -->
    <div id="screen-pokedex" class="hidden w-full h-full flex-col p-4 bg-slate-900 relative z-40">
        <!-- 도감 헤더 -->
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-4 bg-slate-800 p-4 rounded-2xl border-2 border-slate-700">
            <div class="flex items-center gap-3">
                <button onclick="showScreen('title')" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl text-lg font-bold btn-push">

        </div>

    <!-- 6. 출석 도장 모달 -->
    <div id="attendanceModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border-4 border-purple-400 rounded-3xl p-6 w-full max-w-md flex flex-col items-center relative text-center">

            <h3 class="text-3xl font-bold text-yellow-300 mb-2">📅 매일매일 출석 도장</h3>

                    for(let i=1; i<=12; i++) {
                        document.write(`

                확인

        </div>
    </div>

    <!-- 포켓몬 데이터베이스 및 퀴즈 데이터 생성 스크립트 -->
    <script>
        // ==========================================
        // 1. SOUND SYSTEM (Web Audio API)
        // ==========================================
        let soundEnabled = true;
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            const txt = document.getElementById('soundTxt');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high';
                txt.innerText = '소리 ON';
                playBeep(600, 0.1);
            } else {
                icon.className = 'fa-solid fa-volume-xmark';
                txt.innerText = '소리 OFF';
            }
            localStorage.setItem('poke_quiz_sound', soundEnabled ? 'ON' : 'OFF');
        }

        function playBeep(freq, duration, type = 'sine') {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }

        function playSoundEffect(name) {
            if (!soundEnabled) return;
            const ctx = getAudioContext();
            if (name === 'correct') {
                playBeep(523.25, 0.1); // C5
                setTimeout(() => playBeep(659.25, 0.1), 100); // E5
                setTimeout(() => playBeep(783.99, 0.2), 200); // G5
            } else if (name === 'wrong') {
                playBeep(220, 0.15, 'sawtooth');
                setTimeout(() => playBeep(180, 0.25, 'sawtooth'), 150);
            } else if (name === 'catch') {
                playBeep(440, 0.1);
                setTimeout(() => playBeep(587.33, 0.1), 100);
                setTimeout(() => playBeep(880, 0.3), 200);
            } else if (name === 'battle') {
                playBeep(300, 0.08, 'square');
                setTimeout(() => playBeep(400, 0.08, 'square'), 80);
                setTimeout(() => playBeep(500, 0.08, 'square'), 160);
                setTimeout(() => playBeep(600, 0.15, 'square'), 240);
            }
        }

        // ==========================================
        // 2. POKEMON DATA (1~151 + 전설/희귀 30마리)
        // ==========================================
        // 간단한 원본 데이터 매핑 (주요 1~151세대 포켓몬 및 전설 포켓몬)
        const POKEMON_DATABASE = [
            // [ID, 한글이름, 타입배열, 지역]  (지역: forest, city, desert, ocean)
            [1, "이상해씨", ["풀", "독"], "forest"],
            [4, "파이리", ["불꽃"], "desert"],
            [7, "꼬부기", ["물"], "ocean"],
            [10, "캐터피", ["벌레"], "forest"],
            [12, "버터플", ["벌레", "비행"], "forest"],
            [16, "구구", ["노말", "비행"], "city"],
            [19, "꼬렛", ["노말"], "city"],
            [25, "피카츄", ["전기"], "city"],
            [26, "라이츄", ["전기"], "city"],
            [27, "모래두지", ["땅"], "desert"],
            [35, "삐삐", ["페어리"], "city"],
            [37, "식식이", ["불꽃"], "desert"],
            [39, "푸린", ["노말", "페어리"], "city"],
            [43, "뚜벅쵸", ["풀", "독"], "forest"],
            [52, "나옹", ["노말"], "city"],
            [54, "고라파덕", ["물"], "ocean"],
            [58, "가디", ["불꽃"], "desert"],
            [60, "발챙이", ["물"], "ocean"],
            [63, "케이시", ["에스퍼"], "city"],
            [66, "알통몬", ["격투"], "city"],
            [74, "꼬마돌", ["바위", "땅"], "desert"],
            [77, "포니타", ["불꽃"], "desert"],
            [79, "야돈", ["물", "에스퍼"], "ocean"],
            [86, "쥬쥬", ["물"], "ocean"],
            [92, "고스통", ["고스트", "독"], "city"],
            [95, "롱스톤", ["바위", "땅"], "desert"],
            [104, "탕구리", ["땅"], "desert"],

            [143, "잠만보", ["노말"], "city"],

            let correctVal = rawQuiz.ansStr !== undefined ? rawQuiz.ansStr : options[rawQuiz.ansIndex];
            
            // 중복 제거 및 무작위 섞기
            options = Array.from(new Set(options));
            while (options.length < 4) {
                options.push("정답 아님 " + (options.length + 1));
            }
            // Shuffle
            for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }

            const correctIdx = options.findIndex(val => String(val) === String(correctVal));

            return {
                question: rawQuiz.q,
                options: options.map(v => String(v)),
                correctIndex: correctIdx >= 0 ? correctIdx : 0
            };

        function spawnPokeballs() {
            pokeballs = [];
            const ballCount = 5;
            for (let i = 0; i < ballCount; i++) {
                const isGolden = (i === 0 || Math.random() < 0.25); // 금색볼 생성
                pokeballs.push({
                    x: Math.random() * (canvas.width - 100) + 50,
                    y: Math.random() * (canvas.height - 150) + 80,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: (Math.random() - 0.5) * 1.5,
                    isGolden: isGolden,
                    radius: isGolden ? 20 : 16
                });
            }
        }

        function gameLoop() {
            if (document.getElementById('screen-field').classList.contains('hidden')) return;

            updateField();

        function updateField() {
            // 키보드 이동 처리
            let moveX = 0;
            let moveY = 0;
            if (keysPressed['ArrowUp'] || keysPressed['w'] || keysPressed['W']) moveY -= 1;
            if (keysPressed['ArrowDown'] || keysPressed['s'] || keysPressed['S']) moveY += 1;
            if (keysPressed['ArrowLeft'] || keysPressed['a'] || keysPressed['A']) moveX -= 1;
            if (keysPressed['ArrowRight'] || keysPressed['d'] || keysPressed['D']) moveX += 1;

            if (moveX !== 0 || moveY !== 0) {
                player.x += moveX * player.speed;
                player.y += moveY * player.speed;
                player.targetX = player.x;
                player.targetY = player.y;
            } else {
                // 클릭/터치 목표 지점으로 이동
                const dx = player.targetX - player.x;
                const dy = player.targetY - player.y;
                const dist = Math.hypot(dx, dy);
                if (dist > player.speed) {
                    player.x += (dx / dist) * player.speed;
                    player.y += (dy / dist) * player.speed;
                } else {
                    player.x = player.targetX;
                    player.y = player.targetY;
                }
            }

            // 화면 경계 제한
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius + 60, Math.min(canvas.height - player.radius - 20, player.y));

            // 몬스터볼 이동 및 충돌 검사
            pokeballs.forEach((ball, idx) => {
                ball.x += ball.vx;
                ball.y += ball.vy;

                // 벽 반사
                if (ball.x < ball.radius || ball.x > canvas.width - ball.radius) ball.vx *= -1;
                if (ball.y < ball.radius + 60 || ball.y > canvas.height - ball.radius) ball.vy *= -1;

                // 플레이어와의 충돌 검사 (배틀 시작)
                const dist = Math.hypot(player.x - ball.x, player.y - ball.y);
                if (dist < player.radius + ball.radius) {
                    // 충돌 발생 -> 배틀 진입
                    const triggeredBall = pokeballs.splice(idx, 1)[0];
                    startBattle(triggeredBall.isGolden);
                }
            });

            // 공이 다 떨어지면 재생성
            if (pokeballs.length === 0) {
                spawnPokeballs();
            }
        }

        function renderField() {
            // 배경 그리기
            ctx.fillStyle = REGION_BG_COLORS[currentRegion] || '#2e7d32';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 장식 그리드 패턴
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 2;
            const step = 60;
            for (let x = 0; x < canvas.width; x += step) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += step) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // 몬스터볼 그리기
            pokeballs.forEach(ball => {
                ctx.save();
                ctx.translate(ball.x, ball.y);

                // 볼 그림자
                ctx.beginPath();
                ctx.ellipse(0, ball.radius - 2, ball.radius, ball.radius * 0.4, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fill();

                // 볼 본체
                ctx.beginPath();
                ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = ball.isGolden ? '#ffd700' : '#ef4444';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#000000';
                ctx.stroke();

                // 볼 아래 하얀색
                ctx.beginPath();
                ctx.arc(0, 0, ball.radius, 0, Math.PI);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.stroke();

                // 중앙 선 & 단추
                ctx.beginPath();
                ctx.moveTo(-ball.radius, 0);
                ctx.lineTo(ball.radius, 0);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(0, 0, ball.radius * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            });

            // 주인공 캐릭터 그리기 (귀여운 지우 모자 캐릭터)
            ctx.save();
            ctx.translate(player.x, player.y);

            // 캐릭터 그림자
            ctx.beginPath();
            ctx.ellipse(0, player.radius - 4, player.radius, player.radius * 0.4, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fill();

            // 몸통
            ctx.beginPath();
            ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#3b82f6';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            // 빨간 모자 표현
            ctx.beginPath();
            ctx.arc(0, -6, player.radius * 0.8, Math.PI, Math.PI * 2);
            ctx.fillStyle = '#ef4444';
            ctx.fill();

            // 눈 표현
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(-7, 0, 4, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(7, 0, 4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#000000';
            ctx.beginPath(); ctx.arc(-7, 0, 2, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(7, 0, 2, 0, Math.PI * 2); ctx.fill();

            ctx.restore();
        }

        // ==========================================
        // 6. BATTLE & QUIZ LOGIC
        // ==========================================
        let battleState = {
            pokemon: null,
            isGolden: false,
            stage: 1, // 1: 실루엣 맞히기, 2: 학습 퀴즈
            hearts: 3,
            currentQuizIndex: 0,
            totalQuizzes: 2,
            currentQuizData: null,
            disabledOptions: []
        };

        function startBattle(isGolden = false) {
            playSoundEffect('battle');

            // 해당 지역에 맞는 포켓몬 후보 필터링
            let candidates = POKEDEX_LIST.filter(p => p.region === currentRegion);
            if (isGolden) {
                // 금색볼인 경우 전설 또는 희귀 포켓몬 위주
                const legendaries = POKEDEX_LIST.filter(p => p.isLegendary);
                if (legendaries.length > 0) candidates = legendaries;
            }
            if (candidates.length === 0) candidates = POKEDEX_LIST;

            const selectedPoke = candidates[Math.floor(Math.random() * candidates.length)];

            battleState = {
                pokemon: selectedPoke,
                isGolden: isGolden,
                stage: 1,
                hearts: 3,
                currentQuizIndex: 0,
                totalQuizzes: isGolden ? 4 : 2,
                currentQuizData: null,
                disabledOptions: []
            };

            showScreen('battle');
            updateHeartsUI();

            // Stage 1: 실루엣 퀴즈 세팅
            setupSilhouetteStage();
        }

        function updateHeartsUI() {
            const container = document.getElementById('heartContainer');
            let html = '';
            for (let i = 0; i < 3; i++) {
                if (i < battleState.hearts) {
                    html += '<span class="text-red-500 animate-pulse">❤️</span>';
                } else {
                    html += '<span class="text-slate-600">🖤</span>';
                }
            }
            container.innerHTML = html;
        }

        function setupSilhouetteStage() {
            document.getElementById('quizProgressTag').innerText = `1단계: 포켓몬 누구일까? ${battleState.isGolden ? '🌟전설 등장!' : ''}`;
            
            const imgEl = document.getElementById('battlePokeImg');
            imgEl.src = battleState.pokemon.img;
            imgEl.classList.add('silhouette');

            document.getElementById('pokeNameTag').innerText = '???';
            document.getElementById('pokeTypeTags').classList.add('hidden');
            document.getElementById('quizQuestionBox').innerText = '이 포켓몬의 이름은 무엇일까?';

            // 오답 보기 3개 생성
            const otherNames = POKEDEX_LIST.filter(p => p.name !== battleState.pokemon.name).map(p => p.name);
            const shuffleOthers = otherNames.sort(() => 0.5 - Math.random()).slice(0, 3);
            const options = [battleState.pokemon.name, ...shuffleOthers].sort(() => 0.5 - Math.random());

            battleState.currentQuizData = {
                question: '이 포켓몬의 이름은 무엇일까?',
                options: options,
                correctIndex: options.indexOf(battleState.pokemon.name)
            };
            battleState.disabledOptions = [];

            renderOptionsUI();
        }

        function setupQuizStage() {
            document.getElementById('quizProgressTag').innerText = `2단계: 학습 퀴즈 (${battleState.currentQuizIndex + 1}/${battleState.totalQuizzes})`;
            
            // 실루엣 해제 및 포켓몬 정보 공개
            const imgEl = document.getElementById('battlePokeImg');
            imgEl.classList.remove('silhouette');
            document.getElementById('pokeNameTag').innerText = battleState.pokemon.name;

            // 타입 태그 표시
            const typeBox = document.getElementById('pokeTypeTags');
            typeBox.innerHTML = battleState.pokemon.types.map(t => 
                `<span class="bg-yellow-400 text-slate-900 font-bold px-3 py-1 rounded-full text-sm">${t}</span>`
            ).join('');
            typeBox.classList.remove('hidden');

            // 퀴즈 하나 가져오기
            battleState.currentQuizData = getRandomQuiz();
            battleState.disabledOptions = [];

            document.getElementById('quizQuestionBox').innerText = battleState.currentQuizData.question;
            renderOptionsUI();
        }

        function renderOptionsUI() {
            const buttons = document.querySelectorAll('.quiz-opt-btn');
            const data = battleState.currentQuizData;

            buttons.forEach((btn, idx) => {
                const txtEl = btn.querySelector('.opt-text');
                txtEl.innerText = data.options[idx];

                // 이미 틀린 선택지 처리
                if (battleState.disabledOptions.includes(idx)) {
                    btn.disabled = true;
                    btn.className = 'quiz-opt-btn bg-slate-700 text-slate-500 text-xl sm:text-2xl font-bold py-3 px-4 rounded-2xl border-2 border-slate-600 cursor-not-allowed opacity-50 flex items-center justify-start gap-2';
                } else {
                    btn.disabled = false;
                    btn.className = 'quiz-opt-btn bg-blue-600 hover:bg-blue-500 text-white text-xl sm:text-2xl font-bold py-3 px-4 rounded-2xl border-2 border-blue-300 btn-push flex items-center justify-start gap-2';
                }
            });
        }

        function handleAnswerChoice(chosenIdx) {
            if (battleState.disabledOptions.includes(chosenIdx)) return;

            const isCorrect = (chosenIdx === battleState.currentQuizData.correctIndex);

            if (isCorrect) {
                // 정답!
                playSoundEffect('correct');

                if (battleState.stage === 1) {
                    // Stage 1 통과 -> Stage 2 학습 퀴즈로
                    battleState.stage = 2;
                    setupQuizStage();
                } else {
                    // Stage 2 학습 퀴즈 정답
                    battleState.currentQuizIndex++;
                    if (battleState.currentQuizIndex >= battleState.totalQuizzes) {
                        // 모든 퀴즈 완료 -> 잡기 성공!
                        catchSuccess();
                    } else {
                        // 다음 퀴즈 문제
                        setupQuizStage();
                    }
                }
            } else {
                // 오답!
                playSoundEffect('wrong');
                battleState.hearts--;
                battleState.disabledOptions.push(chosenIdx);
                updateHeartsUI();

                if (battleState.hearts <= 0) {
                    // 도망침 처리
                    pokemonRunAway();
                } else {
                    // 동일 문제 유지, 오답 비활성화
                    renderOptionsUI();
                }
            }
        }

        function catchSuccess() {
            playSoundEffect('catch');

            // 도감에 추가
            if (!gameState.caughtPokemon.includes(battleState.pokemon.id)) {
                gameState.caughtPokemon.push(battleState.pokemon.id);
                saveGameState();
            }

            // 축하 메시지 팝업 연출
            document.getElementById('quizQuestionBox').innerText = `🎉 축하합니다! [${battleState.pokemon.name}]을(를) 잡았습니다!`;
            document.getElementById('quizOptionsGrid').innerHTML = `
                <button onclick="returnToField()" class="col-span-2 bg-green-500 hover:bg-green-400 text-white text-2xl font-bold py-4 rounded-2xl border-4 border-white btn-push">
                    몬스터볼에 보관하고 계속 탐험하기! 🚀
                </button>
            `;
        }

        function pokemonRunAway() {
            document.getElementById('quizQuestionBox').innerText = `🏃‍♂️ 아쉽게도 [${battleState.pokemon.name}]이(가) 도망쳤습니다!`;
            document.getElementById('quizOptionsGrid').innerHTML = `
                <button onclick="returnToField()" class="col-span-2 bg-slate-600 hover:bg-slate-500 text-white text-2xl font-bold py-4 rounded-2xl border-4 border-white btn-push">
                    필드로 돌아가기 🐾
                </button>
            `;
        }

        function returnToField() {
            // 버튼들 복구
            document.getElementById('quizOptionsGrid').innerHTML = `
                <button onclick="handleAnswerChoice(0)" class="quiz-opt-btn bg-blue-600 hover:bg-blue-500 text-white text-xl sm:text-2xl font-bold py-3 px-4 rounded-2xl border-2 border-blue-300 btn-push flex items-center justify-start gap-2">
                    <span class="bg-blue-800 text-yellow-300 text-base px-2 py-0.5 rounded-lg">1</span> <span class="opt-text flex-1 text-center">보기 1</span>
                </button>
                <button onclick="handleAnswerChoice(1)" class="quiz-opt-btn bg-blue-600 hover:bg-blue-500 text-white text-xl sm:text-2xl font-bold py-3 px-4 rounded-2xl border-2 border-blue-300 btn-push flex items-center justify-start gap-2">
                    <span class="bg-blue-800 text-yellow-300 text-base px-2 py-0.5 rounded-lg">2</span> <span class="opt-text flex-1 text-center">보기 2</span>
                </button>
                <button onclick="handleAnswerChoice(2)" class="quiz-opt-btn bg-blue-600 hover:bg-blue-500 text-white text-xl sm:text-2xl font-bold py-3 px-4 rounded-2xl border-2 border-blue-300 btn-push flex items-center justify-start gap-2">
                    <span class="bg-blue-800 text-yellow-300 text-base px-2 py-0.5 rounded-lg">3</span> <span class="opt-text flex-1 text-center">보기 3</span>
                </button>
                <button onclick="handleAnswerChoice(3)" class="quiz-opt-btn bg-blue-600 hover:bg-blue-500 text-white text-xl sm:text-2xl font-bold py-3 px-4 rounded-2xl border-2 border-blue-300 btn-push flex items-center justify-start gap-2">
                    <span class="bg-blue-800 text-yellow-300 text-base px-2 py-0.5 rounded-lg">4</span> <span class="opt-text flex-1 text-center">보기 4</span>
                </button>
            `;
            startField(currentRegion);
        }

        // PC 1~4번 키로 답변 선택 지원
        window.addEventListener('keydown', (e) => {
            if (document.getElementById('screen-battle').classList.contains('hidden')) return;
            if (['1', '2', '3', '4'].includes(e.key)) {
                const idx = parseInt(e.key) - 1;
                handleAnswerChoice(idx);
            }
        });

        // ==========================================
        // 7. POKEDEX SCREEN LOGIC
        // ==========================================
        let currentFilter = 'all';

        function openPokedex() {
            showScreen('pokedex');
            renderPokedex();
        }

        function filterPokedex(filter) {
            currentFilter = filter;
            document.getElementById('dexFilterAll').className = filter === 'all' ? 'bg-blue-600 text-white px-4 py-2 rounded-xl text-lg font-bold' : 'bg-slate-700 text-white px-4 py-2 rounded-xl text-lg font-bold';
            document.getElementById('dexFilterCaught').className = filter === 'caught' ? 'bg-blue-600 text-white px-4 py-2 rounded-xl text-lg font-bold' : 'bg-slate-700 text-white px-4 py-2 rounded-xl text-lg font-bold';
            renderPokedex();
        }

        function renderPokedex() {
            const grid = document.getElementById('pokedexGrid');
            grid.innerHTML = '';

            const caughtCount = gameState.caughtPokemon.length;
            document.getElementById('pokedexStats').innerText = `잡은 수: ${caughtCount} / ${POKEDEX_LIST.length}`;

            POKEDEX_LIST.forEach(poke => {
                const isCaught = gameState.caughtPokemon.includes(poke.id);

                if (currentFilter === 'caught' && !isCaught) return;

                const card = document.createElement('div');
                card.className = `flex flex-col items-center justify-center p-3 rounded-2xl border-2 transition-all ${
                    isCaught 
                        ? 'bg-slate-800 border-yellow-400/60 text-white' 
                        : 'bg-slate-900 border-slate-800 text-slate-500 opacity-75'
                }`;

                card.innerHTML = `
                    <div class="text-xs font-bold text-yellow-400 mb-1">No.${String(poke.id).padStart(3, '0')}</div>
                    <img src="${poke.img}" class="w-16 h-16 sm:w-20 sm:h-20 object-contain mb-2 ${isCaught ? '' : 'silhouette'}" alt="${poke.name}">
                    <div class="text-base sm:text-lg font-bold text-center">${isCaught ? poke.name : '???'}</div>
                    ${isCaught ? `<div class="text-xs text-slate-400 mt-1">${poke.types.join('/')}</div>` : ''}
                `;

                grid.appendChild(card);
            });
        }

        // ==========================================
        // 8. ATTENDANCE STAMP SYSTEM
        // ==========================================
        function openAttendanceModal() {
            const modal = document.getElementById('attendanceModal');
            modal.classList.remove('hidden');

            const count = gameState.stamps.length;
            for (let i = 1; i <= 12; i++) {
                const slot = document.getElementById(`stamp-slot-${i}`);
                if (i <= count) {
                    slot.innerHTML = '<span class="text-red-500 stamp-animation">💮</span>';
                } else {
                    slot.innerHTML = '';
                }
            }
        }

        function closeAttendanceModal() {
            document.getElementById('attendanceModal').classList.add('hidden');
        }

        // ==========================================
        // 9. SCREEN SWITCHING & INIT
        // ==========================================
        function showScreen(screenName) {
            const screens = ['title', 'region', 'field', 'battle', 'pokedex'];
            screens.forEach(s => {
                const el = document.getElementById(`screen-${s}`);
                if (s === screenName) el.classList.remove('hidden');
                else el.classList.add('hidden');
            });

            if (screenName === 'field') {
                resizeCanvas();
            }
        }

        function showRegionSelect() {
            showScreen('region');
        }

        // 초기화 코드 실행
        window.onload = function() {
            initCanvas();
            loadGameState();
            console.log("포켓몬 퀴즈 모험 게임이 성공적으로 로드되었습니다.");
        };
    </script>
</body>
