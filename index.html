<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><title>포켓몬 퀴즈 탐험 학교</title><style>

#pi{background:var(--card);border:4px solid var(--ink);border-radius:18px;padding:14px;width:100%;max-width:460px;max-height:92vh;overflow:auto;text-align:center}

#gb #hud{justify-content:center;gap:12px;color:#e8e0ff;margin:0 0 6px;font-size:14px}
#bz{position:relative;background:#35353d;border-radius:12px 12px 36px 12px;padding:14px 14px 10px;box-shadow:inset 0 2px #55555f}

#gb #cv{border:3px solid #111;border-radius:4px}
#lbl{color:#d8ccff;font-weight:800;font-style:italic;letter-spacing:1px;margin:8px 0 0;font-size:15px;text-align:left}
