<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>하준하늘아빠의 포켓몬 퀴즈 수집 게임</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Jua', sans-serif; user-select: none; }
    body { background-color: #0f172a; touch-action: manipulation; overflow: hidden; }
    .pixelated { image-rendering: pixelated; }
    .silhouette { filter: brightness(0); }
  </style>
</head>
<body class="h-screen w-screen flex items-center justify-center relative">

  <!-- 메인 게임 컨테이너 (16:9 비율 고정 및 반응형) -->
  <div id="game-container" class="relative w-full max-w-4xl h-full max-h-[600px] bg-slate-800 rounded-xl overflow-hidden shadow-2xl border-4 border-slate-700 flex flex-col">
    
    <!-- 오디오 컨트롤 버튼 -->
    <button id="sound-btn" onclick="toggleSound()" class="absolute top-3 right-3 z-50 bg-white/80 p-2 rounded-full shadow hover:bg-white text-xl">
      🔊
    </button>

    <!-- 1. 타이틀 화면 -->
    <div id="screen-title" class="absolute inset-0 z-40 bg-gradient-to-b from-sky-400 to-indigo-600 flex flex-col items-center justify-center p-6 text-white text-center">
      <h1 class="text-4xl md:text-5xl font-extrabold drop-shadow-md mb-2 text-yellow-300">🎮 포켓몬 퀴즈 수집</h1>
      <p class="text-lg md:text-xl text-sky-100 mb-8">퀴즈를 맞히고 전설의 포켓몬을 수집해보자!</p>
      
      <div class="flex flex-wrap gap-4 justify-center mb-6">
        <button onclick="showMapSelect()" class="bg-yellow-400 hover:bg-yellow-300 text-slate-900 font-bold text-2xl px-8 py-4 rounded-2xl shadow-lg border-b-4 border-yellow-600 active:translate-y-1">
          모험 시작하기 🚀
        </button>
        <button onclick="openBook()" class="bg-emerald-500 hover:bg-emerald-400 text-white font-bold text-xl px-6 py-4 rounded-2xl shadow-lg border-b-4 border-emerald-700 active:translate-y-1">
          📖 포켓몬 도감
        </button>
        <button onclick="openAttendance()" class="bg-pink-500 hover:bg-pink-400 text-white font-bold text-xl px-6 py-4 rounded-2xl shadow-lg border-b-4 border-pink-700 active:translate-y-1">
          📅 출석 달력
        </button>
      </div>
    </div>

    <!-- 2. 필드 화면 (Canvas) -->
    <div id="screen-field" class="relative w-full h-full hidden">
      <canvas id="fieldCanvas" class="w-full h-full block cursor-pointer"></canvas>
      
      <!-- 상단 헤더 UI -->
      <div class="absolute top-3 left-3 flex gap-2">
        <button onclick="showMapSelect()" class="bg-white/90 px-4 py-2 rounded-xl shadow font-bold text-slate-800 hover:bg-white">
          🗺️ 지도
        </button>
        <div id="area-badge" class="bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold shadow">
          🌲 숲
        </div>
      </div>
    </div>

    <!-- 3. 지도 선택 팝업 -->
    <div id="modal-map" class="absolute inset-0 z-50 bg-black/60 flex items-center justify-center p-4 hidden">
      <div class="bg-white rounded-3xl p-6 w-full max-w-lg shadow-2xl border-4 border-sky-300 text-center">
        <h2 class="text-2xl font-bold text-slate-800 mb-4">🗺️ 어디로 모험을 떠날까?</h2>
        <div class="grid grid-cols-2 gap-4 mb-4">
          <button onclick="selectArea('forest')" class="p-4 bg-emerald-100 hover:bg-emerald-200 border-2 border-emerald-400 rounded-2xl flex flex-col items-center">
            <span class="text-4xl mb-1">🌲</span>
            <span class="font-bold text-emerald-800">풀과 벌레의 숲</span>
          </button>
          <button onclick="selectArea('city')" class="p-4 bg-slate-100 hover:bg-slate-200 border-2 border-slate-400 rounded-2xl flex flex-col items-center">
            <span class="text-4xl mb-1">🏙️</span>
            <span class="font-bold text-slate-800">노멀과 노랑 도시</span>
          </button>
          <button onclick="selectArea('desert')" class="p-4 bg-amber-100 hover:bg-amber-200 border-2 border-amber-400 rounded-2xl flex flex-col items-center">
            <span class="text-4xl mb-1">🏜️</span>
            <span class="font-bold text-amber-800">바위와 땅의 사막</span>
          </button>
          <button onclick="selectArea('ocean')" class="p-4 bg-blue-100 hover:bg-blue-200 border-2 border-blue-400 rounded-2xl flex flex-col items-center">
            <span class="text-4xl mb-1">🌊</span>
            <span class="font-bold text-blue-800">물과 얼음의 바다</span>
          </button>
        </div>
        <button onclick="closeMapSelect()" class="bg-slate-400 hover:bg-slate-500 text-white px-6 py-2 rounded-xl font-bold">닫기</button>
      </div>
    </div>

    <!-- 4. 배틀 & 퀴즈 화면 -->
    <div id="screen-battle" class="absolute inset-0 z-40 bg-slate-900 hidden flex flex-col">
      <!-- 상단 정보바 -->
      <div class="p-3 bg-slate-800/80 flex justify-between items-center text-white px-6">
        <div class="flex items-center gap-2">
          <span id="quiz-pokemon-name" class="bg-indigo-600 px-3 py-1 rounded-lg font-bold">???</span>
          <span id="ball-type-badge" class="bg-yellow-500 text-slate-900 px-2 py-1 rounded-lg text-xs font-bold">일반 몬스터볼</span>
        </div>
        <div id="lives-container" class="flex text-2xl gap-1">
          ❤️ ❤️ ❤️
        </div>
      </div>

      <!-- 배틀 필드 및 포켓몬 영역 -->
      <div class="flex-1 relative flex items-center justify-center bg-gradient-to-b from-sky-300 to-emerald-200 overflow-hidden">
        <!-- 대형 그림 및 포켓몬 스프라이트 -->
        <div class="relative flex flex-col items-center">
          <img id="battle-pokemon-img" class="w-44 h-44 object-contain transition-all duration-300 silhouette" src="" alt="pokemon">
          <div class="w-36 h-6 bg-black/20 rounded-full blur-sm -mt-4"></div>
        </div>
      </div>

      <!-- 하단 퀴즈 영역 -->
      <div class="bg-slate-800 p-4 border-t-4 border-slate-700 flex flex-col gap-3">
        <!-- 질문 박스 (이미지 포함) -->
        <div class="bg-slate-700 p-3 rounded-xl text-white text-center flex flex-col items-center justify-center min-h-[70px]">
          <img id="quiz-image" class="h-20 object-contain mb-2 rounded border border-slate-500 hidden" src="" alt="quiz image">
          <div id="quiz-question" class="text-lg md:text-xl font-bold">이 포켓몬은 누구일까?</div>
        </div>

        <!-- 보기 버튼 (4지선다) -->
        <div class="grid grid-cols-2 gap-2">
          <button id="opt-0" onclick="checkAnswer(0)" class="quiz-opt-btn bg-white hover:bg-slate-100 text-slate-900 font-bold p-3 rounded-xl border-b-4 border-slate-300 text-lg flex items-center justify-center gap-2">
            <span class="w-6 h-6 rounded-full bg-indigo-500 text-white text-xs flex items-center justify-center">1</span> <span class="btn-txt"></span>
          </button>
          <button id="opt-1" onclick="checkAnswer(1)" class="quiz-opt-btn bg-white hover:bg-slate-100 text-slate-900 font-bold p-3 rounded-xl border-b-4 border-slate-300 text-lg flex items-center justify-center gap-2">
            <span class="w-6 h-6 rounded-full bg-indigo-500 text-white text-xs flex items-center justify-center">2</span> <span class="btn-txt"></span>
          </button>
          <button id="opt-2" onclick="checkAnswer(2)" class="quiz-opt-btn bg-white hover:bg-slate-100 text-slate-900 font-bold p-3 rounded-xl border-b-4 border-slate-300 text-lg flex items-center justify-center gap-2">
            <span class="w-6 h-6 rounded-full bg-indigo-500 text-white text-xs flex items-center justify-center">3</span> <span class="btn-txt"></span>
          </button>
          <button id="opt-3" onclick="checkAnswer(3)" class="quiz-opt-btn bg-white hover:bg-slate-100 text-slate-900 font-bold p-3 rounded-xl border-b-4 border-slate-300 text-lg flex items-center justify-center gap-2">
            <span class="w-6 h-6 rounded-full bg-indigo-500 text-white text-xs flex items-center justify-center">4</span> <span class="btn-txt"></span>
          </button>
        </div>
      </div>
    </div>

    <!-- 5. 포켓몬 도감 모달 -->
    <div id="modal-book" class="absolute inset-0 z-50 bg-black/70 flex items-center justify-center p-4 hidden">
      <div class="bg-slate-800 rounded-3xl p-6 w-full max-w-2xl h-[85%] shadow-2xl border-4 border-emerald-400 flex flex-col">
        <div class="flex justify-between items-center mb-4 text-white">
          <h2 class="text-2xl font-bold">📖 포켓몬 도감</h2>
          <div class="text-sm bg-slate-700 px-3 py-1 rounded-full text-emerald-300 font-bold" id="book-progress">수집률: 0%</div>
        </div>
        
        <!-- 도감 리스트 -->
        <div id="book-grid" class="flex-1 overflow-y-auto grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3 p-2 bg-slate-900/50 rounded-2xl">
          <!-- JS로 동적 생성 -->
        </div>

        <button onclick="closeBook()" class="mt-4 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl w-full">돌아가기</button>
      </div>
    </div>

    <!-- 6. 출석 달력 모달 -->
    <div id="modal-attendance" class="absolute inset-0 z-50 bg-black/70 flex items-center justify-center p-4 hidden">
      <div class="bg-white rounded-3xl p-6 w-full max-w-md shadow-2xl border-4 border-pink-300 text-center flex flex-col items-center">
        <h2 class="text-2xl font-bold text-slate-800 mb-2">📅 출석 스탬프</h2>
        <p id="att-status" class="text-pink-600 font-bold mb-4">오늘의 도장이 찍혔어요!</p>
        
        <div id="att-grid" class="grid grid-cols-5 gap-2 mb-6 w-full">
          <!-- 10일 출석 도장 간이 달력 -->
        </div>

        <button onclick="closeAttendance()" class="bg-slate-700 hover:bg-slate-800 text-white font-bold py-3 rounded-xl w-full">확인</button>
      </div>
    </div>

  </div>

  <script>
    // --- Audio Synthesis Engine ---
    let soundEnabled = true;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
    }

    function playSound(type) {
      if (!soundEnabled) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      if (type === 'correct') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now); // Do
        osc.frequency.setValueAtTime(659.25, now + 0.1); // Mi
        osc.frequency.setValueAtTime(783.99, now + 0.2); // Sol
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.setValueAtTime(150, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'catch') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(880, now + 0.1);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-btn').innerText = soundEnabled ? '🔊' : '🔇';
    }

    // --- Pokemon Data Database ---
    const POKEMON_DATA = [
      { id: 1, name: '이상해씨', type: 'grass', area: 'forest' },
      { id: 4, name: '파이리', type: 'fire', area: 'desert' },
      { id: 7, name: '꼬부기', type: 'water', area: 'ocean' },
      { id: 10, name: '캐터피', type: 'grass', area: 'forest' },
      { id: 25, name: '피카츄', type: 'electric', area: 'city' },
      { id: 39, name: '푸린', type: 'normal', area: 'city' },
      { id: 50, name: '디그다', type: 'ground', area: 'desert' },
      { id: 52, name: '나옹', type: 'normal', area: 'city' },
      { id: 54, name: '고라파덕', type: 'water', area: 'ocean' },
      { id: 129, name: '잉어킹', type: 'water', area: 'ocean' },
      { id: 133, name: '이브이', type: 'normal', area: 'city' },
      { id: 143, name: '잠만보', type: 'normal', area: 'city' },
      // Rare/Legendary
      { id: 150, name: '뮤츠', type: 'psychic', area: 'all', legendary: true },
      { id: 151, name: '뮤', type: 'psychic', area: 'all', legendary: true },
      { id: 249, name: '루기아', type: 'psychic', area: 'all', legendary: true },
      { id: 250, name: '칠색조', type: 'fire', area: 'all', legendary: true },
      { id: 384, name: '레쿠쟈', type: 'dragon', area: 'all', legendary: true },
      { id: 493, name: '아르세우스', type: 'normal', area: 'all', legendary: true }
    ];

    function getPokeImgUrl(id) {
      return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
    }

    // --- Local Storage Management ---
    let userState = {
      caught: [],
      stamps: 1,
      lastDate: new Date().toDateString()
    };

    function loadState() {
      const saved = localStorage.getItem('pkmn_quiz_state');
      if (saved) {
        userState = JSON.parse(saved);
        const today = new Date().toDateString();
        if (userState.lastDate !== today) {
          userState.stamps = (userState.stamps || 0) + 1;
          userState.lastDate = today;
          saveState();
        }
      } else {
        saveState();
      }
    }

    function saveState() {
      localStorage.setItem('pkmn_quiz_state', JSON.stringify(userState));
    }

    // --- Dynamic Question Generator (Addition, Subtraction, Multiplication, Division, Word/Image) ---
    const UN SPLASH_IMAGES = {
      '사과': 'https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=200&auto=format&fit=crop&q=80',
      '바나나': 'https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=200&auto=format&fit=crop&q=80',
      '강아지': 'https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=200&auto=format&fit=crop&q=80',
      '고양이': 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=200&auto=format&fit=crop&q=80',
      '자동차': 'https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?w=200&auto=format&fit=crop&q=80'
    };

    function generateMathQuestion() {
      const type = Math.floor(Math.random() * 4);
      let qText = "", ans = 0;

      if (type === 0) { // Addition (1~50)
        const a = Math.floor(Math.random() * 40) + 5;
        const b = Math.floor(Math.random() * 40) + 5;
        qText = `${a} + ${b} = ?`;
        ans = a + b;
      } else if (type === 1) { // Subtraction
        const a = Math.floor(Math.random() * 50) + 20;
        const b = Math.floor(Math.random() * (a - 5)) + 1;
        qText = `${a} - ${b} = ?`;
        ans = a - b;
      } else if (type === 2) { // Multiplication (Single digits 2~9)
        const a = Math.floor(Math.random() * 8) + 2;
        const b = Math.floor(Math.random() * 8) + 2;
        qText = `${a} × ${b} = ?`;
        ans = a * b;
      } else { // Division
        const b = Math.floor(Math.random() * 8) + 2;
        const ansVal = Math.floor(Math.random() * 8) + 2;
        const a = b * ansVal;
        qText = `${a} ÷ ${b} = ?`;
        ans = ansVal;
      }

      // Generate 4 Options
      let opts = new Set([ans]);
      while (opts.size < 4) {
        let wrong = ans + (Math.floor(Math.random() * 10) - 5);
        if (wrong > 0 && wrong !== ans) opts.add(wrong);
      }

      return {
        question: qText,
        imageUrl: null,
        options: Array.from(opts).sort(() => Math.random() - 0.5),
        correctIndex: 0 // Will be calculated after shuffle
      };
    }

    function generateWordQuestion() {
      const words = Object.keys(UNSPLASH_IMAGES);
      const target = words[Math.floor(Math.random() * words.length)];
      
      let opts = new Set([target]);
      while (opts.size < 4) {
        opts.add(words[Math.floor(Math.random() * words.length)]);
      }

      return {
        question: "다음 그림에 맞는 낱말은 무엇일까요?",
        imageUrl: UNSPLASH_IMAGES[target],
        options: Array.from(opts).sort(() => Math.random() - 0.5),
        targetWord: target
      };
    }

    // --- Game Logic Engine ---
    let currentArea = 'forest';
    let canvas, ctx;
    let player = { x: 200, y: 200, targetX: 200, targetY: 200 };
    let monsterBall = { x: 300, y: 150, isGolden: false, active: true };
    let battleState = {
      active: false,
      pokemon: null,
      step: 'who', // 'who' -> 'quiz'
      lives: 3,
      quizIndex: 0,
      totalQuizzes: 2,
      currentQuiz: null
    };

    function initCanvas() {
      canvas = document.getElementById('fieldCanvas');
      ctx = canvas.getContext('2d');
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        player.targetX = e.clientX - rect.left;
        player.targetY = e.clientY - rect.top;
      });

      // Key controls
      window.addEventListener('keydown', (e) => {
        if (battleState.active) {
          if (['1', '2', '3', '4'].includes(e.key)) {
            checkAnswer(parseInt(e.key) - 1);
          }
          return;
        }
        const speed = 15;
        if (e.key === 'ArrowUp' || e.key === 'w') player.targetY -= speed;
        if (e.key === 'ArrowDown' || e.key === 's') player.targetY += speed;
        if (e.key === 'ArrowLeft' || e.key === 'a') player.targetX -= speed;
        if (e.key === 'ArrowRight' || e.key === 'd') player.targetX += speed;
      });

      requestAnimationFrame(gameLoop);
    }

    function resizeCanvas() {
      if (!canvas) return;
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }

    function selectArea(area) {
      currentArea = area;
      document.getElementById('area-badge').innerText = {
        forest: '🌲 숲', city: '🏙️ 도시', desert: '🏜️ 사막', ocean: '🌊 바다'
      }[area];
      closeMapSelect();
      respawnBall();
    }

    function respawnBall() {
      monsterBall.x = 50 + Math.random() * (canvas.width - 100);
      monsterBall.y = 50 + Math.random() * (canvas.height - 100);
      monsterBall.isGolden = Math.random() < 0.25; // 25% chance for legendary
      monsterBall.active = true;
    }

    function gameLoop() {
      // Update Player position smoothly
      player.x += (player.targetX - player.x) * 0.1;
      player.y += (player.targetY - player.y) * 0.1;

      // Draw background
      if (currentArea === 'forest') ctx.fillStyle = '#a7f3d0';
      else if (currentArea === 'city') ctx.fillStyle = '#e2e8f0';
      else if (currentArea === 'desert') ctx.fillStyle = '#fef08a';
      else ctx.fillStyle = '#bae6fd';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Ball
      if (monsterBall.active) {
        ctx.beginPath();
        ctx.arc(monsterBall.x, monsterBall.y, 16, 0, Math.PI * 2);
        ctx.fillStyle = monsterBall.isGolden ? '#eab308' : '#ef4444';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#000';
        ctx.stroke();

        // Ball Collision Check
        const dist = Math.hypot(player.x - monsterBall.x, player.y - monsterBall.y);
        if (dist < 30) {
          monsterBall.active = false;
          startBattle(monsterBall.isGolden);
        }
      }

      // Draw Player
      ctx.beginPath();
      ctx.arc(player.x, player.y, 20, 0, Math.PI * 2);
      ctx.fillStyle = '#3b82f6';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#fff';
      ctx.stroke();

      requestAnimationFrame(gameLoop);
    }

    // --- Battle & Quiz Logic ---
    function startBattle(isGolden) {
      battleState.active = true;
      battleState.lives = 3;
      battleState.step = 'who';
      battleState.quizIndex = 0;
      battleState.totalQuizzes = isGolden ? 4 : 2;

      // Filter Pokemon pool
      let pool = POKEMON_DATA.filter(p => isGolden ? p.legendary : (p.area === currentArea || p.area === 'all'));
      if (pool.length === 0) pool = POKEMON_DATA;
      battleState.pokemon = pool[Math.floor(Math.random() * pool.length)];

      document.getElementById('screen-battle').classList.remove('hidden');
      document.getElementById('ball-type-badge').innerText = isGolden ? '✨ 금색 몬스터볼' : '🔴 일반 몬스터볼';
      document.getElementById('quiz-pokemon-name').innerText = '???';
      
      const img = document.getElementById('battle-pokemon-img');
      img.src = getPokeImgUrl(battleState.pokemon.id);
      img.classList.add('silhouette');

      updateLivesUI();
      setupWhoQuiz();
    }

    function updateLivesUI() {
      let hearts = '';
      for (let i = 0; i < 3; i++) {
        hearts += i < battleState.lives ? '❤️ ' : '🖤 ';
      }
      document.getElementById('lives-container').innerText = hearts;
    }

    function setupWhoQuiz() {
      document.getElementById('quiz-image').classList.add('hidden');
      document.getElementById('quiz-question').innerText = '이 포켓몬의 이름은 무엇일까?';

      let opts = new Set([battleState.pokemon.name]);
      while (opts.size < 4) {
        opts.add(POKEMON_DATA[Math.floor(Math.random() * POKEMON_DATA.length)].name);
      }
      const shuffledOpts = Array.from(opts).sort(() => Math.random() - 0.5);

      battleState.currentQuiz = {
        type: 'who',
        correctIndex: shuffledOpts.indexOf(battleState.pokemon.name),
        options: shuffledOpts
      };

      renderQuizOptions(shuffledOpts);
    }

    function nextStudyQuiz() {
      battleState.step = 'quiz';
      const useWord = Math.random() < 0.3; // 30% image quiz
      let qData = useWord ? generateWordQuestion() : generateMathQuestion();

      if (useWord) {
        document.getElementById('quiz-image').src = qData.imageUrl;
        document.getElementById('quiz-image').classList.remove('hidden');
        document.getElementById('quiz-question').innerText = qData.question;
        qData.correctIndex = qData.options.indexOf(qData.targetWord);
      } else {
        document.getElementById('quiz-image').classList.add('hidden');
        document.getElementById('quiz-question').innerText = `포켓몬 문제 (${battleState.quizIndex + 1}/${battleState.totalQuizzes}): ${qData.question}`;
        qData.correctIndex = qData.options.indexOf(qData.options.find(o => o === eval(qData.question.replace('×','*').replace('÷','/').replace('= ?',''))));
      }

      battleState.currentQuiz = qData;
      renderQuizOptions(qData.options);
    }

    function renderQuizOptions(opts) {
      for (let i = 0; i < 4; i++) {
        const btn = document.getElementById(`opt-${i}`);
        btn.disabled = false;
        btn.classList.remove('opacity-30', 'bg-red-200');
        btn.querySelector('.btn-txt').innerText = opts[i];
      }
    }

    function checkAnswer(idx) {
      const q = battleState.currentQuiz;
      if (idx === q.correctIndex) {
        playSound('correct');
        if (battleState.step === 'who') {
          // Revealed
          document.getElementById('battle-pokemon-img').classList.remove('silhouette');
          document.getElementById('quiz-pokemon-name').innerText = battleState.pokemon.name;
          nextStudyQuiz();
        } else {
          battleState.quizIndex++;
          if (battleState.quizIndex >= battleState.totalQuizzes) {
            // Catch Success!
            playSound('catch');
            if (!userState.caught.includes(battleState.pokemon.id)) {
              userState.caught.push(battleState.pokemon.id);
              saveState();
            }
            alert(`🎉 잡았다! ${battleState.pokemon.name}을(를) 도감에 등록했어요!`);
            exitBattle();
          } else {
            nextStudyQuiz();
          }
        }
      } else {
        // Wrong
        playSound('wrong');
        battleState.lives--;
        updateLivesUI();
        
        const btn = document.getElementById(`opt-${idx}`);
        btn.disabled = true;
        btn.classList.add('opacity-30', 'bg-red-200');

        if (battleState.lives <= 0) {
          alert(`💨 ${battleState.pokemon.name}이(가) 도망쳤어요!`);
          exitBattle();
        }
      }
    }

    function exitBattle() {
      battleState.active = false;
      document.getElementById('screen-battle').classList.add('hidden');
      respawnBall();
    }

    // --- UI Modals ---
    function showMapSelect() { document.getElementById('modal-map').classList.remove('hidden'); }
    function closeMapSelect() { document.getElementById('modal-map').classList.add('hidden'); }

    function openBook() {
      const grid = document.getElementById('book-grid');
      grid.innerHTML = '';
      let caughtCount = 0;

      POKEMON_DATA.forEach(p => {
        const isCaught = userState.caught.includes(p.id);
        if (isCaught) caughtCount++;

        const card = document.createElement('div');
        card.className = `p-2 rounded-xl flex flex-col items-center justify-center text-center text-xs font-bold ${isCaught ? 'bg-slate-700 text-white' : 'bg-slate-800/50 text-slate-500'}`;
        card.innerHTML = `
          <img src="${getPokeImgUrl(p.id)}" class="w-12 h-12 object-contain mb-1 ${isCaught ? '' : 'silhouette opacity-40'}">
          <div>${isCaught ? p.name : '???'}</div>
        `;
        grid.appendChild(card);
      });

      const rate = Math.round((caughtCount / POKEMON_DATA.length) * 100);
      document.getElementById('book-progress').innerText = `수집률: ${rate}% (${caughtCount}/${POKEMON_DATA.length})`;
      document.getElementById('modal-book').classList.remove('hidden');
    }
    function closeBook() { document.getElementById('modal-book').classList.add('hidden'); }

    function openAttendance() {
      const grid = document.getElementById('att-grid');
      grid.innerHTML = '';
      for (let i = 1; i <= 10; i++) {
        const stamped = i <= userState.stamps;
        const box = document.createElement('div');
        box.className = `h-12 rounded-xl border-2 flex items-center justify-center text-lg font-bold ${stamped ? 'bg-pink-100 border-pink-400 text-pink-500' : 'bg-slate-100 border-slate-300 text-slate-300'}`;
        box.innerText = stamped ? '🌸' : i;
        grid.appendChild(box);
      }
      document.getElementById('modal-attendance').classList.remove('hidden');
    }
    function closeAttendance() { document.getElementById('modal-attendance').classList.add('hidden'); }

    // Init Engine
    window.onload = () => {
      loadState();
      initCanvas();
      document.getElementById('screen-field').classList.remove('hidden');
    };
  </script>
</body>
</html>
