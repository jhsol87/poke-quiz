<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>포켓몬 탐험학교</title>
<style>
:root{--ink:#34445a;--cream:#fffaf0;--blue:#7dc8e8;--pink:#ffb8c9;--green:#9bd7a4}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Arial","Apple SD Gothic Neo",sans-serif;background:#dff4e4;color:var(--ink);touch-action:none}
button{font:inherit;border:0;border-radius:16px;padding:12px 16px;background:#fff;color:var(--ink);font-weight:800;box-shadow:0 3px 0 #d3dce3;cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #d3dce3}
button:disabled{opacity:.45;cursor:default}
#app{width:100%;height:100%;display:flex;flex-direction:column}
header{height:58px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:#ffffffd9;gap:8px;z-index:2}
.brand{font-size:clamp(16px,2.3vw,23px);font-weight:900;color:#3984a4;white-space:nowrap}
.hud{display:flex;align-items:center;gap:7px;min-width:0}.pill{background:#f0f7ff;border-radius:20px;padding:8px 12px;font-size:clamp(11px,1.6vw,15px);font-weight:800;white-space:nowrap}
#gameWrap{position:relative;flex:1;min-height:0;overflow:hidden;background:#b8e4b0}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#menus{position:absolute;inset:0;pointer-events:none}
.panel{pointer-events:auto;position:absolute;background:#fffdf5f2;border:3px solid #fff;border-radius:24px;box-shadow:0 10px 30px #37546b30;padding:clamp(14px,2vw,24px);max-height:94%;overflow:auto}
.center{left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,92vw);text-align:center}
.hidden{display:none!important}
h1{font-size:clamp(24px,4vw,38px);margin:5px 0 10px;color:#3984a4}h2{margin:4px 0 12px;font-size:clamp(20px,3vw,28px)}
p{line-height:1.5}.sub{color:#738196;font-size:14px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.choice{min-width:125px;font-size:18px;background:#f0f8ff;border:2px solid #d9efff}.primary{background:#70c7e7;color:#123b51}.pink{background:#ffd5df}.green{background:#c9f0cc}
#toolbar{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
#toolbar button{padding:10px 13px;font-size:14px}
#dpad{position:absolute;left:12px;bottom:12px;display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:42px 42px;gap:4px;pointer-events:auto;opacity:.88}
#dpad button{padding:0;font-size:22px;background:#ffffffdf;touch-action:none}
#dpad .up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#ffffffd9;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none}
.quizQ{font-size:clamp(20px,3.4vw,31px);font-weight:900;margin:12px 0 18px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answers button{min-height:58px;font-size:clamp(16px,2.5vw,22px);background:#f2f8ff;border:2px solid #d9eafa}
.feedback{font-size:19px;font-weight:900;min-height:28px;margin:10px}
.pokeArt{font-size:82px;margin:2px}.bar{height:10px;background:#e7edf1;border-radius:9px;overflow:hidden}.bar>i{display:block;height:100%;background:#79d39a}
.gridDex{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.dexItem{background:#f2f7f8;border-radius:14px;padding:8px;font-size:13px}.dexItem .emoji{font-size:32px}.unknown{filter:brightness(0)}
#calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{padding:9px 0;border-radius:10px;background:#f2f6f8}.stamped{background:#d5f4d8}
footer{height:25px;flex:none;text-align:center;font-size:10px;color:#718096;padding:4px}

</style>
</head>
<body><div id="app">
<header><div class="brand">🌈 포켓몬 탐험학교</div><div class="hud"><span class="pill" id="playerTag">플레이어 선택</span><span class="pill" id="regionTag">초록숲</span><span class="pill" id="countTag">도감 0 / 151</span></div></header>
<div id="gameWrap"><canvas id="world"></canvas><div id="menus">
<div id="profile" class="panel center"><h1>포켓몬 탐험학교</h1><p>탐험하고, 생각하고, 새로운 친구를 만나자!</p><div class="row"><button class="choice primary" onclick="startPlayer('하준이')">🧢 하준이</button><button class="choice pink" onclick="startPlayer('하늘이')">🎀 하늘이</button></div><p class="sub">각 플레이어의 모험은 따로 저장돼요.</p></div>
<div id="quiz" class="panel center hidden"><div id="quizTop" class="sub"></div><div id="pokeArea"></div><div id="question" class="quizQ"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="row"><button id="nextBtn" class="primary hidden" onclick="nextQuestion()">다음으로</button></div></div>
<div id="dex" class="panel center hidden"><h2>📖 나의 포켓몬 도감</h2><p id="dexCount"></p><div id="dexGrid" class="gridDex"></div><div class="row" style="margin-top:14px"><button onclick="closePanel()">탐험으로 돌아가기</button></div></div>
<div id="attendance" class="panel center hidden"><h2>📅 출석 도장</h2><div class="row"><button onclick="changeMonth(-1)">◀</button><b id="monthLabel"></b><button onclick="changeMonth(1)">▶</button></div><div id="calendar" style="margin-top:12px"></div><div class="row" style="margin-top:14px"><button onclick="closePanel()">탐험으로 돌아가기</button></div></div>
<div id="settings" class="panel center hidden"><h2>⚙️ 모험 설정</h2><p>학습 난이도</p><div class="row"><button onclick="setLevel('easy')">쉬움</button><button onclick="setLevel('normal')">보통</button><button onclick="setLevel('hard')">도전</button></div><p>소리</p><div class="row"><button onclick="toggleSound()">🔊 소리 켜기/끄기</button><button onclick="resetPlayer()">이 플레이어 기록 초기화</button></div><div class="row" style="margin-top:14px"><button onclick="closePanel()">닫기</button></div></div>
<div id="caught" class="panel center hidden"><h1>🎉 친구가 되었어요!</h1><div id="caughtArt" class="pokeArt"></div><h2 id="caughtName"></h2><p id="caughtType"></p><button class="primary" onclick="finishCatch()">탐험 계속하기</button></div>
</div>
<div id="toolbar" class="hidden"><button onclick="openDex()">📖 도감</button><button onclick="openAttendance()">📅 출석</button><button onclick="openSettings()">⚙️ 설정</button><button onclick="switchPlayer()">↩ 플레이어</button></div>
<div id="dpad" class="hidden"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div>
<div id="hint" class="hidden">풀숲으로 걸어가 보세요! · 방향키 / WASD</div>
</div><footer>포켓몬 탐험학교 · 진행 상황은 이 기기에 자동 저장됩니다.</footer></div>

function defaultData(name){return {name,caught:[],visited:[0],x:180,y:180,level:name==='하준이'?'normal':'easy',sound:true,attendance:{},lastRegion:0,seenQuestions:[],lastSave:Date.now()};}
function loadData(name){try{let d=JSON.parse(localStorage.getItem('poke-school-'+name));return d&&d.name===name?{...defaultData(name),...d}:defaultData(name)}catch(e){return defaultData(name)}}
function save(){if(!player)return;player.x=world.x;player.y=world.y;player.lastRegion=regionAt(world.x,world.y).id;player.visited=[...new Set([...player.visited,player.lastRegion])];player.lastSave=Date.now();try{localStorage.setItem('poke-school-'+player.name,JSON.stringify(player))}catch(e){}updateHud();}
function startPlayer(name){player=loadData(name);soundOn=player.sound!==false;world={x:player.x||180,y:player.y||180};$('profile').classList.add('hidden');$('toolbar').classList.remove('hidden');$('dpad').classList.remove('hidden');$('hint').classList.remove('hidden');$('playerTag').textContent=player.name;let today=new Date().toISOString().slice(0,10);player.attendance[today]=true;save();resize();requestAnimationFrame(loop);}
function switchPlayer(){save();player=null;world=null;hidePanels();$('profile').classList.remove('hidden');$('toolbar').classList.add('hidden');$('dpad').classList.add('hidden');$('hint').classList.add('hidden');}
function updateHud(){if(!player)return;$('countTag').textContent=`도감 ${player.caught.length} / ${pokemon.length}`;$('regionTag').textContent=regionAt(world.x,world.y).name.replace('과 꽃밭','').replace('과 동굴','');}
function regionAt(x,y){let rx=Math.max(0,Math.min(2,Math.floor(x/900))),ry=Math.max(0,Math.min(2,Math.floor(y/700)));let id=ry*3+rx;return {...regions[id],id};}

window.addEventListener('resize',resize);

function drawTerrain(x,y,sx,sy){ctx.strokeStyle='#ffffff30';ctx.lineWidth=2;for(let i=0;i<12;i++){ctx.beginPath();ctx.moveTo(sx+i*83,sy);ctx.lineTo(sx+i*83,sy+700);ctx.stroke();}}
function drawGrass(x,y,special){ctx.fillStyle=special?'#f8e58b':'#65ad68';ctx.beginPath();ctx.ellipse(x,y,42,25,0,0,Math.PI*2);ctx.fill();for(let i=0;i<8;i++){ctx.strokeStyle=special?'#fff2a8':'#3e8d54';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-30+i*8,y+8);ctx.lineTo(x-35+i*9,y-12-(i%3)*5);ctx.stroke();}}
function loop(t){if(!player)return;let dt=Math.min(.04,(t-lastTime)/1000||.016);lastTime=t;if(!$('quiz').classList.contains('hidden')||!$('dex').classList.contains('hidden')||!$('attendance').classList.contains('hidden')||!$('settings').classList.contains('hidden')||!$('caught').classList.contains('hidden')){requestAnimationFrame(loop);return;}
 let dx=0,dy=0;if(keys.ArrowUp||keys.w||touchDir==='up')dy=-1;if(keys.ArrowDown||keys.s||touchDir==='down')dy=1;if(keys.ArrowLeft||keys.a||touchDir==='left')dx=-1;if(keys.ArrowRight||keys.d||touchDir==='right')dx=1;
 if(dx||dy){let l=Math.hypot(dx,dy);dx/=l;dy/=l;let nx=world.x+dx*175*dt,ny=world.y+dy*175*dt;nx=Math.max(25,Math.min(2675,nx));ny=Math.max(25,Math.min(2075,ny));if(!blocked(nx,ny)){world.x=nx;world.y=ny;steps++;encounterTimer+=dt;} }
 cam.x=Math.max(0,Math.min(2700-W,world.x-W/2));cam.y=Math.max(0,Math.min(2100-H,world.y-H/2));worldDraw();if(encounterTimer>2.8){encounterTimer=0;tryEncounter();}if(t%4000<35)save();requestAnimationFrame(loop);}
function blocked(x,y){return false;}
function tryEncounter(){let r=regionAt(world.x,world.y);let inGrass=false;let lx=world.x%900,ly=world.y%700;for(let gx of [110,550])for(let gy of [130,500])if(Math.hypot(lx-gx,ly-gy)<62)inGrass=true;if(!inGrass)return;let pool=pokemon.filter(p=>p.rarity!=='legendary'&&p.type.split('/').some(t=>r.types.includes(t)));if(Math.random()<.92&&pool.length){let rare=Math.random()<.09;let p=rare?pool[Math.floor(Math.random()*pool.length)]:pool.filter(p=>p.rarity==='common')[Math.floor(Math.random()*Math.max(1,pool.filter(p=>p.rarity==='common').length))]||pool[0];beginEncounter(p,rare||p.rarity==='rare');}}
function beginEncounter(p,rare){activeEncounter=p;quizState={stage:'name',hearts:3,wrong:[],learn:0,total:rare?4:2,rare,answers:[],current:null};showPanel('quiz');renderNameQuiz();}
function showPanel(id){hidePanels();$(id).classList.remove('hidden');}
function hidePanels(){['quiz','dex','attendance','settings','caught'].forEach(id=>$(id).classList.add('hidden'));}
function renderNameQuiz(){let p=activeEncounter;$('quizTop').textContent=`야생 포켓몬 발견! ${quizState.rare?'✨ 반짝이는 희귀 포켓몬':'🌿 새로운 만남'} · 하트 ${'❤️'.repeat(quizState.hearts)}`;$('pokeArea').innerHTML=`<div class="pokeArt" style="filter:brightness(0)">❔</div>`;$('question').textContent='이 포켓몬의 이름은 무엇일까요?';let opts=[p.name];while(opts.length<4){let n=pokemon[Math.floor(Math.random()*pokemon.length)].name;if(!opts.includes(n))opts.push(n);}shuffle(opts);renderAnswers(opts,p.name,()=>{quizState.stage='learn';$('pokeArea').innerHTML=`<div class="pokeArt">${p.emoji}</div><b>${p.name}</b> · ${p.type}`;renderLearn();},true);}
function renderAnswers(opts,answer,onCorrect,disableWrong){$('answers').innerHTML='';$('feedback').textContent='';$('nextBtn').classList.add('hidden');opts.forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(b.disabled)return;if(v===answer){b.style.background='#d4f5d9';sound(740);$('feedback').textContent='정답이에요! 참 잘했어요!';$('answers').querySelectorAll('button').forEach(x=>x.disabled=true);setTimeout(onCorrect,650);}else{b.disabled=true;b.style.background='#ffe0e0';sound(180);if(disableWrong){quizState.hearts--;$('quizTop').textContent=`틀려도 괜찮아요! 하트 ${'❤️'.repeat(quizState.hearts)}`;if(quizState.hearts<=0){$('feedback').textContent='포켓몬이 숲으로 돌아갔어요. 다음에 또 만나요!';setTimeout(closePanel,1000);}}else{$('feedback').textContent='괜찮아요! 다시 생각해 봐요.';}}};$('answers').appendChild(b);});}
function pickQuestion(){let keys=['math','korean','english','think'];let k=keys[quizState.learn%4],bank=banks[k].filter(q=>q.level==='easy'||player.level==='hard'||(player.level==='normal'&&q.level!=='hard'));let unused=bank.filter(q=>!player.seenQuestions.includes(k+':'+q.q));if(!unused.length){player.seenQuestions=player.seenQuestions.slice(-80);unused=bank;}let q=unused[Math.floor(Math.random()*unused.length)];player.seenQuestions.push(k+':'+q.q);return {...q,k};}
function renderLearn(){if(quizState.learn>=quizState.total){catchAnimation();return;}let q=pickQuestion();quizState.current=q;$('quizTop').textContent=`${areas[['math','korean','english','think'].indexOf(q.k)]} 퀴즈 ${quizState.learn+1} / ${quizState.total}`;$('pokeArea').innerHTML=`<div class="pokeArt">${activeEncounter.emoji}</div><b>${activeEncounter.name}</b>`;$('question').textContent=q.q;let opts=[...q.opts];if(!opts.includes(q.a))opts[0]=q.a;shuffle(opts);renderAnswers(opts,q.a,()=>{$('nextBtn').classList.remove('hidden');$('nextBtn').textContent=quizState.learn+1===quizState.total?'포획하기':'다음 문제';},false);}
function nextQuestion(){quizState.learn++;renderLearn();}
function catchAnimation(){hidePanels();$('caught').classList.remove('hidden');$('caughtArt').textContent='🔴⚪';$('caughtName').textContent='몬스터볼이 흔들흔들...';$('caughtType').textContent='두근두근!';setTimeout(()=>{if(!$('caught').classList.contains('hidden')){$('caughtArt').textContent=activeEncounter.emoji;$('caughtName').textContent=activeEncounter.name+' 포획 성공!';$('caughtType').textContent=activeEncounter.type+' 타입 친구가 도감에 등록됐어요.';if(!player.caught.includes(activeEncounter.id))player.caught.push(activeEncounter.id);save();sound(950);}},1800);}
function finishCatch(){hidePanels();activeEncounter=null;save();}
function closePanel(){hidePanels();save();}
function openDex(){if(!player)return;$('dexCount').textContent=`${player.caught.length} / ${pokemon.length}마리 발견`;let caught=new Set(player.caught);$('dexGrid').innerHTML=pokemon.map(p=>`<div class="dexItem"><div class="emoji ${caught.has(p.id)?'':'unknown'}">${caught.has(p.id)?p.emoji:'❔'}</div><b>${caught.has(p.id)?p.name:'???'}</b><br><span>${caught.has(p.id)?'#'+String(p.id).padStart(3,'0')+' · '+p.type:'아직 만나지 못했어요'}</span></div>`).join('');showPanel('dex');}
function openAttendance(){monthCursor=new Date();renderCalendar();showPanel('attendance');}
function changeMonth(n){monthCursor.setMonth(monthCursor.getMonth()+n);renderCalendar();}
function renderCalendar(){let y=monthCursor.getFullYear(),m=monthCursor.getMonth();$('monthLabel').textContent=`${y}년 ${m+1}월`;let first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let s=['일','월','화','수','목','금','토'].map(v=>`<div class="day"><b>${v}</b></div>`).join('');for(let i=0;i<first;i++)s+='<div></div>';for(let d=1;d<=days;d++){let key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;s+=`<div class="day ${player.attendance[key]?'stamped':''}">${d}<br>${player.attendance[key]?'⭐':''}</div>`;}$('calendar').innerHTML=s;}
function openSettings(){showPanel('settings');}
function setLevel(v){player.level=v;save();$('feedback').textContent='난이도가 저장됐어요.';}
function toggleSound(){soundOn=!soundOn;player.sound=soundOn;save();soundOn?sound(600):null;}
function resetPlayer(){if(confirm(player.name+'의 도감과 출석 기록을 초기화할까요?')){player=defaultData(player.name);world={x:180,y:180};save();closePanel();}}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sound(freq){if(!soundOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.06,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.18);o.start();o.stop(audioCtx.currentTime+.2);}catch(e){}}
window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();});
window.addEventListener('keyup',e=>keys[e.key]=false);
$('dpad').querySelectorAll('button').forEach(b=>{let d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();touchDir=d;b.setPointerCapture(e.pointerId);});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>{if(touchDir===d)touchDir=null;}));});
window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
resize();
</script></body></html>
